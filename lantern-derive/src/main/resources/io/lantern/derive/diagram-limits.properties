# How much a C4 container or component diagram may hold and still read well (docs/design.md,
# Readable diagrams). These are Lantern's defaults; the app's own settings override any of them
# under the same names (lantern.diagrams.*). No copy of these numbers is kept in the code.
#
# The elements a view aims to stay within, and how many past it it may still show (#836; owner's
# decision of 5 Nov 2026: 8 and 2). Above their sum, what can be grouped or merged is (#764).
lantern.diagrams.target=8
lantern.diagrams.tolerance=2
# The most lines per element a view draws.
lantern.diagrams.lines-per-element=2
# The least scale a drawn view may be shrunk to so it fits the page width, its labels still legible.
lantern.diagrams.scale=0.8
# The most line crossings of a drawn view before it is called hard to read (a warning only).
lantern.diagrams.crossings=5
# The fewest members a domain or feature area needs in a view to be drawn as one box standing for
# them; a smaller group stands for nothing and its members are drawn as themselves.
lantern.diagrams.smallest-group=2
# The most units a pocket of units that work closely together holds, for units no explicit signal
# groups into a domain (#764): small enough that a pocket's own page, its units with their
# neighbours outside it, fits the target above.
lantern.diagrams.pocket-size=4
