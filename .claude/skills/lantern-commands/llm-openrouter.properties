# LLM settings for every run that counts: Claude Haiku 5.5, Sonnet 5.5 and Opus 5.5 through
# OpenRouter's Anthropic-compatible Messages endpoint, on the owner's Anthropic key as BYOK
# (docs/adr/0070-course-correction-measured-acceptance.md, amendment for #737; ADR 0102, amendment
# for #754). No key here: pass it with --lantern.llm.anthropic.api-key or ANTHROPIC_API_KEY, set to
# the OpenRouter API key. Prices in US dollars per million tokens, from OpenRouter's model list
# (https://openrouter.ai/api/v1/models, 3 Nov 2026), which charges no markup on inference; a one-hour
# cache write costs 2 times input.

lantern.llm.anthropic.base-url=https://openrouter.ai/api
# Only Anthropic serves a request, never Amazon Bedrock or Google Vertex, so the prompt cache stays
# with one provider. OpenRouter's Anthropic endpoint has no Message Batches API, so nothing batches.
lantern.llm.anthropic.only-providers=anthropic

lantern.llm.models.haiku.provider=anthropic
lantern.llm.models.haiku.id=anthropic/claude-haiku-5.5
lantern.llm.models.haiku.context-window=1000000
lantern.llm.models.haiku.capabilities=prompt-caching,tool-use
lantern.llm.models.haiku.prices.input=0.10
lantern.llm.models.haiku.prices.output=0.50
lantern.llm.models.haiku.prices.cache-write=0.125
lantern.llm.models.haiku.prices.cache-write-long=0.20
lantern.llm.models.haiku.prices.cache-read=0.01
lantern.llm.models.haiku.thinking-headroom-tokens=4000
lantern.llm.models.haiku.max-concurrency=12
# Claude counts about 1.55 tokens for each token of Lantern's estimates (ADR 0100, amendment for
# #694); measured again by #754's run.
lantern.llm.models.haiku.estimate-token-scale=1.55

lantern.llm.models.sonnet.provider=anthropic
lantern.llm.models.sonnet.id=anthropic/claude-sonnet-5.5
lantern.llm.models.sonnet.context-window=1000000
lantern.llm.models.sonnet.capabilities=prompt-caching,tool-use
lantern.llm.models.sonnet.prices.input=2
lantern.llm.models.sonnet.prices.output=10
lantern.llm.models.sonnet.prices.cache-write=2.5
lantern.llm.models.sonnet.prices.cache-write-long=4
lantern.llm.models.sonnet.prices.cache-read=0.10
lantern.llm.models.sonnet.thinking-headroom-tokens=4000
lantern.llm.models.sonnet.max-concurrency=12
lantern.llm.models.sonnet.estimate-token-scale=1.55

lantern.llm.models.opus.provider=anthropic
lantern.llm.models.opus.id=anthropic/claude-opus-5.5
lantern.llm.models.opus.context-window=1000000
lantern.llm.models.opus.capabilities=prompt-caching,tool-use
lantern.llm.models.opus.prices.input=4
lantern.llm.models.opus.prices.output=20
lantern.llm.models.opus.prices.cache-write=5
lantern.llm.models.opus.prices.cache-write-long=8
lantern.llm.models.opus.prices.cache-read=0.20
lantern.llm.models.opus.thinking-headroom-tokens=4000
lantern.llm.models.opus.max-concurrency=6
lantern.llm.models.opus.estimate-token-scale=1.55

# Haiku for the high-volume and bulk roles; Sonnet for Investigate, the support judge and the
# reasoning roles (ADR 0070, decision 2). The wording judge needs a model no writer uses: Opus.
lantern.llm.tiers.bulk=haiku
lantern.llm.tiers.high-volume=haiku
lantern.llm.tiers.reasoning=sonnet
lantern.llm.roles.judge=sonnet
lantern.llm.roles.wording-judge=opus
