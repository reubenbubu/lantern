[task]
question = "The setting spring.datasource.password of orders holds a secret, and a value for it is written in a file of the repository. Is a value a deployed system uses committed there, or only a placeholder, an empty default or a local developer value?"
verdicts = "confirmed: a deployed run uses the committed value, so whoever reads the repository can use it. refuted: deployed runs take the value from elsewhere (an environment variable, a secret store), and you can show where. unclear: the code does not settle it."
repositories = ["shop"]

[[evidence]]
what = "orders sets spring.datasource.password (in the default profile)."
where = "shop:orders/src/main/resources/application.yml"
code = """
3      url: jdbc:postgresql://db:5432/orders
4      username: orders
5      password: ******
6    jpa:
7      hibernate:
"""

[start]
hint = "Compare the file's profiles with what the deployment files (Compose, Helm, Kustomize) set."
