[task]
question = "The endpoint DELETE /orders/{id} of orders checks only that the caller is signed in. The endpoint's code: OrderController.delete. Can a caller who should not be allowed use it, or does a check elsewhere (a filter, a security configuration, the method's own code) stop them?"
verdicts = "confirmed: a caller without the right role or membership can use it on some path. refuted: a check stops them on every path, and you can show it. unclear: the code does not settle it."
repositories = ["shop"]

[[evidence]]
what = "OrderController.delete answers DELETE /orders/{id}."
where = "shop:orders/src/main/java/shop/orders/OrderController.java"
code = """
12    @PreAuthorize("isAuthenticated()")
13    @DeleteMapping("/{id}")
14    void delete(@PathVariable long id) {
15      service.delete(id);
16    }
"""
