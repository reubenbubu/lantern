# Lantern settings for analyzing the OpenWMS test set. Pass this file to Lantern with
# --spring.config.additional-location=file:testsets/openwms/lantern.properties (several locations
# are separated by commas); the OpenWMS build tests read it too.
#
# The Maven repositories sandbox builds may download from (docs/adr/0023): Maven Central, and the
# Alfresco repository that core.process.execution and the tms.routing repos name in their POMs for
# Activiti 8.8.0-alpha.7, which is not on Maven Central.
lantern.sandbox.maven-repositories[0].id=central
lantern.sandbox.maven-repositories[0].url=https://repo.maven.apache.org/maven2
lantern.sandbox.maven-repositories[1].id=activiti
lantern.sandbox.maven-repositories[1].url=https://artifacts.alfresco.com/nexus/content/repositories/activiti-releases
