# Local development database. Start with `docker compose up -d`, or with scripts/launch.sh.
# The host port is LANTERN_DB_PORT, 5432 by default.
# The credentials are local-only defaults, not secrets.
name: lantern

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: lantern
      POSTGRES_USER: lantern
      POSTGRES_PASSWORD: lantern
    ports:
      - "${LANTERN_DB_PORT:-5432}:5432"
    volumes:
      - lantern-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lantern -d lantern"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lantern-postgres:
