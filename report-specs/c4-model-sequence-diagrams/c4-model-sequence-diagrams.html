    case 'alignCol':   return {axis:'C', key:`C|${pair}`};
    case 'near':       return {axis:'N', key:`N|${pair}`};
  }
  return {axis:'B', key:`B|${r.rel}|${r.a}`};   // boundary placements
}
/* Why a candidate rule can't be added: null if it's fine. ignoreIdx skips the rule being edited. */
function ruleProblem(spec, cand, ignoreIdx = -1){
  const f = ruleFact(cand), pairOf = x => [x.a, x.b].sort().join('|'), cp = pairOf(cand);
  const rules = (spec.constraints || []).map((r, i) => ({...r, strict:r.strict !== false, i})).filter(r => r.i !== ignoreIdx);
  for (const r of rules){
    const g = ruleFact(r);
    if (g.key === f.key) return {kind: r.a === cand.a && r.rel === cand.rel ? 'duplicate' : 'equivalent', rule:r};
    if (f.axis === 'B' || g.axis === 'B' || pairOf(r) !== cp) continue;
    // same direction = the "first" element is cand.a in both, or both are symmetric
    const ordered = x => 'VHY'.includes(x.axis);
    const sameDir = ordered(f) && ordered(g) && f.first === g.first;
    // an existing stronger rule already implies the candidate
    const implied = (g.axis === 'V' && ((f.axis === 'Y' && sameDir) || f.axis === 'C')) || (g.axis === 'H' && f.axis === 'R');
    if (implied) return {kind:'implied', rule:r};
    const pairSet = (x, y) => (f.axis === x && g.axis === y) || (f.axis === y && g.axis === x);
    const opposite = (ordered(f) && ordered(g) && !sameDir && (f.axis === g.axis || pairSet('V','Y')))   // A over B vs B over A
      || pairSet('V','H') || pairSet('V','R') || pairSet('Y','H') || pairSet('Y','R') || pairSet('H','C');
    if (opposite) return {kind:'contradicts', rule:r};
  }
  return null;
}
const ruleText = r => `${EL[r.a].name} ${r.strict !== false ? 'must' : 'should ideally'} be ${REL_TEXT[r.rel]} ${EL[r.b] ? EL[r.b].name : r.b}`;
function problemText(pb){
  if (!pb) return '';
  if (pb.kind === 'duplicate') return `Already a rule${pb.rule.strict ? '' : ' (as a preference)'} — change its strength in the list above instead.`;
  if (pb.kind === 'equivalent') return `Same as the existing rule “${ruleText(pb.rule)}”.`;
  if (pb.kind === 'implied') return `Already implied by “${ruleText(pb.rule)}”.`;
  return `Contradicts “${ruleText(pb.rule)}” — remove or change that rule first.`;
}

function renderRuleEditor(){
  const {key, ids} = ruleState, spec = DIAGRAMS[key], single = ids.length === 1, e = EL[ids[0]];
  const form = ruleState.form || {strict:'1', rel:'above', target:''};
  const all = (spec.constraints||[]).map((c,idx) => ({...c, strict:c.strict !== false, idx}));
  const mine = all.filter(c => ids.includes(c.a)).sort((a,b) => ids.indexOf(a.a) - ids.indexOf(b.a));
  const others = single ? specRules(spec).filter(r => r.b === ids[0]) : [];
  const missed = new Set(layoutDiagram(spec)._violations || []);
  const isMissed = r => missed.has(`${r.a} ${r.rel} ${r.b}${r.strict ? '' : ' (soft)'}`);
  const allIds = diagramIds(key).sort((a,b) => EL[a].name.localeCompare(EL[b].name));
  const targets = allIds.filter(t => !ids.includes(t));
  const bnd = boundaryFor(spec, ids), bndT = boundaryTarget(spec, ids);
  const connected = connectedTo(spec, ids);
  // a fresh selection targets the element it's wired to; a choice the user made sticks until the selection changes
  if (!form.target || (!targets.includes(form.target) && form.target !== bndT)) form.target = connected[0] || targets[0];
  if (isBoundaryRel(form.rel) && bnd) form.target = bnd;
  if (isBoundaryRel(form.rel) && !bnd) form.rel = 'above';
  if (!isBoundaryRel(form.rel) && bnd && form.target === bnd) form.rel = 'atTopEdge';
  const sentence = r => `${single ? (r.strict ? 'Must' : 'Should ideally') : `<b>${esc(EL[r.a].name)}</b> ${r.strict ? 'must' : 'should ideally'}`} be ${REL_TEXT[r.rel]} <b>${esc(targetName(spec, r.b))}</b>`;
  const head = single
    ? `<span class="kdot"></span><div class="rp-title"><b>${esc(e.name)}</b><small>Placement rules · ${esc(DIAGRAMS[key].sub || '')}</small></div>`
    : `<span class="rp-count">${ids.length}</span><div class="rp-title"><b>${ids.length} elements selected</b><small>${MOD}-click elements to add or remove</small></div>`;
  $('#rulePop').innerHTML = `
    <div class="rp-head k-${e.kind}" title="Drag to move">${head}
      <button class="rp-x" data-rp="close" title="Close (Esc)" aria-label="Close">${X_ICON}</button></div>
    ${single ? '' : `<div class="rp-chips">${ids.map(id => `<span class="rp-chip k-${EL[id].kind}"><i></i>${esc(EL[id].name)}<button data-rp="unsel" data-id="${id}" title="Remove from selection" aria-label="Remove ${esc(EL[id].name)} from selection">${X_ICON}</button></span>`).join('')}</div>`}
    <div class="rp-sec"><div class="rp-label">${single ? 'Rules for this element' : 'Rules for these elements'}</div>
      ${mine.length ? mine.map(r => `<div class="rp-rule edit${isMissed(r)?' bad':''}">
          <div class="rp-inline">${single ? '' : `<b>${esc(EL[r.a].name)}</b>`}
            <select data-idx="${r.idx}" data-field="strict" aria-label="Strength"><option value="1"${r.strict?' selected':''}>must</option><option value="0"${r.strict?'':' selected'}>should ideally</option></select>
            <span>be</span>
            <select data-idx="${r.idx}" data-field="rel" aria-label="Relation">${relOptions(r.rel, !!boundaryFor(spec, [r.a]))}</select>
            <select data-idx="${r.idx}" data-field="b" aria-label="Other element">${targetOptions(spec, allIds.filter(t => t !== r.a), r.b, boundaryTarget(spec, [r.a]), connectedTo(spec, [r.a]))}</select>
            ${isMissed(r)?'<span class="warn">Couldn’t be met — it conflicts with another rule</span>':''}
          </div>
          <button class="rp-x" data-rp="del" data-idx="${r.idx}" title="Remove rule" aria-label="Remove rule">${X_ICON}</button></div>`).join('')
        : `<div class="rp-empty">None yet — the layout engine decides where ${single ? 'it goes' : 'they go'}.</div>`}
      ${others.length ? `<div class="rp-empty" style="margin-top:8px;font-size:12px">Also referenced by ${others.map(r => `<b style="color:var(--text-2)">${esc(EL[r.a].name)}</b> (${REL_TEXT[r.rel]} it)`).join(', ')}.</div>` : ''}
    </div>
    <div class="rp-sec"><div class="rp-label">Add a rule</div>
      <div class="rp-sentence"><b>${single ? esc(e.name) : `All ${ids.length}`}</b>
        <select id="rpStrict" aria-label="Strength"><option value="1">must</option><option value="0">should ideally</option></select> be
        <select id="rpRel" aria-label="Relation">${relOptions(form.rel, !!bnd)}</select>
        <select id="rpTarget" aria-label="Other element">${targetOptions(spec, targets, form.target, bndT, connected)}</select>
      </div>
      <div class="rp-hint" id="rpHint" hidden></div>
      <div class="rp-actions"><small>${single ? `Tip: ${MOD}-click more elements to give them the same rule.` : 'One rule is added for each selected element.'}</small><button class="rp-add" data-rp="add">Add rule</button></div>
    </div>`;
  $('#rpStrict').value = form.strict; $('#rpRel').value = form.rel; $('#rpTarget').value = form.target;
  const sync = ev => {
    const changed = ev && ev.target.id === 'rpRel' ? 'rel' : ev && ev.target.id === 'rpTarget' ? 'b' : null;
    if (changed){ const f = reconcile(spec, ids, $('#rpRel').value, $('#rpTarget').value, changed, targets); $('#rpRel').value = f.rel; $('#rpTarget').value = f.b; }
    ruleState.form = {strict:$('#rpStrict').value, rel:$('#rpRel').value, target:$('#rpTarget').value};
    const rel = $('#rpRel').value, target = $('#rpTarget').value;
    const problems = ids.map(id => ({id, pb: ruleProblem(spec, {a:id, rel, b:target})}));
    const ok = problems.filter(x => !x.pb).length, blocked = problems.filter(x => x.pb);
    const btn = $('#rulePop [data-rp="add"]');
    btn.disabled = !ok;
    btn.textContent = !ok ? (blocked.every(x => x.pb.kind === 'contradicts') ? 'Contradicts a rule' : 'Already covered')
      : single ? 'Add rule' : ok === ids.length ? `Add for all ${ids.length}` : `Add for ${ok} of ${ids.length}`;
    const hint = $('#rpHint');
    hint.innerHTML = !blocked.length ? '' : single ? esc(problemText(blocked[0].pb))
      : blocked.map(x => `<b>${esc(EL[x.id].name)}</b>: ${esc(problemText(x.pb))}`).join('<br>');
    hint.hidden = !blocked.length;
    hint.classList.toggle('bad', blocked.some(x => x.pb.kind === 'contradicts'));
  };
  ['#rpRel','#rpTarget','#rpStrict'].forEach(sel => $(sel).addEventListener('change', sync)); sync();
  placeRuleEditor();
}
function placeRuleEditor(){
  const pop = $('#rulePop'); pop.hidden = false;
  const r = pop.getBoundingClientRect();
  let x, y;
  if (ruleState.pos){ x = ruleState.pos.x; y = ruleState.pos.y; }      // user dragged it: stay put
  else { x = ruleState.x + 16; y = ruleState.y - 40; if (x + r.width > innerWidth - 12) x = ruleState.x - r.width - 16; }
  pop.style.left = clamp(x, 12, innerWidth - r.width - 12) + 'px';
  pop.style.top = clamp(y, 12, innerHeight - r.height - 12) + 'px';
}
function openRuleEditor(key, id, ev){
  hideTip();
  const multi = ev.ctrlKey || ev.metaKey || ev.shiftKey;
  if (multi && ruleState && ruleState.key === key){
    const i = ruleState.ids.indexOf(id);
    if (i >= 0){ ruleState.ids.splice(i, 1); if (!ruleState.ids.length) return closeRuleEditor(); }
    else ruleState.ids.push(id);
  } else {
    ruleState = {key, ids:[id], x:ev.clientX, y:ev.clientY, pos:ruleState && ruleState.key === key ? ruleState.pos : null, form:ruleState && ruleState.form && {...ruleState.form}};
  }
  if (ruleState.form) ruleState.form.target = '';   // selection changed: re-pick the connected element
  markPicked();
  renderRuleEditor();
  updateEditbar();
}
function closeRuleEditor(){ $('#rulePop').hidden = true; ruleState = null; markPicked(); updateEditbar(); }
function markPicked(){ $$('svg[data-key] .node').forEach(n => n.classList.toggle('picked', !!ruleState && ruleState.ids.includes(n.dataset.id) && n.closest('svg').dataset.key === ruleState.key)); }

// edit an existing rule in place
$('#rulePop').addEventListener('change', e => {
  const sel = e.target.closest('select[data-idx]'); if (!sel || !ruleState) return;
  const {key} = ruleState, spec = DIAGRAMS[key], idx = +sel.dataset.idx, c = spec.constraints[idx];
  const next = {...c};
  if (sel.dataset.field === 'strict'){ if (sel.value === '0') next.strict = false; else delete next.strict; }
  else {
    next[sel.dataset.field] = sel.value;
    const f = reconcile(spec, [next.a], next.rel, next.b, sel.dataset.field, diagramIds(key)); next.rel = f.rel; next.b = f.b;
  }
  const pb = sel.dataset.field === 'strict' ? null : ruleProblem(spec, next, idx);
  if (pb){ toast(pb.kind === 'contradicts' ? `That would contradict “${ruleText(pb.rule)}”` : `That's the same as “${ruleText(pb.rule)}”`); return renderRuleEditor(); }
  spec.constraints[idx] = next;
  persistRules(key); refreshDiagram(key);
});

// drag the dialog by its header
(() => {
  let drag = null;
  $('#rulePop').addEventListener('pointerdown', e => {
    const h = e.target.closest('.rp-head'); if (!h || e.target.closest('button')) return;
    const r = $('#rulePop').getBoundingClientRect();
    drag = {dx:e.clientX - r.left, dy:e.clientY - r.top}; h.setPointerCapture(e.pointerId); h.classList.add('dragging'); e.preventDefault();
  });
  $('#rulePop').addEventListener('pointermove', e => {
    if (!drag || !ruleState) return;
    const pop = $('#rulePop'), r = pop.getBoundingClientRect();
    const x = clamp(e.clientX - drag.dx, 4, innerWidth - r.width - 4), y = clamp(e.clientY - drag.dy, 4, innerHeight - 40);
    pop.style.left = x + 'px'; pop.style.top = y + 'px'; ruleState.pos = {x, y};
  });
  const end = () => { if (drag){ drag = null; $$('#rulePop .rp-head').forEach(h => h.classList.remove('dragging')); } };
  $('#rulePop').addEventListener('pointerup', end); $('#rulePop').addEventListener('pointercancel', end);
})();

// Re-lay out and redraw every visible copy of a diagram (inline or maximized)
function refreshDiagram(key){
  const canvases = $$(`.dcard[data-kind="c4"][data-key="${key}"] .dcanvas`);
  if (maxState && maxState.card && maxState.card.dataset.key === key) canvases.push($('#mxCanvas'));
  canvases.forEach(c => c.classList.add('busy'));
  setTimeout(() => {
    const spec = DIAGRAMS[key];
    canvases.forEach(cv => {
      const old = $('svg', cv); if (!old) return;
      const tmp = document.createElement('div'); tmp.innerHTML = c4SVG(spec, key, key);
      const svg = tmp.firstElementChild; old.replaceWith(svg); attachViewer(svg, renderAC && renderAC.signal);
      if (maxState && maxState.svg === old) maxState.svg = svg;
      cv.classList.remove('busy');
    });
    markPicked();
    if (ruleState && ruleState.key === key) renderRuleEditor();
  }, 30);
}

$('#rulePop').addEventListener('click', e => {
  const b = e.target.closest('[data-rp]'); if (!b || !ruleState) return;
  const {key, ids} = ruleState, spec = DIAGRAMS[key];
  if (b.dataset.rp === 'close') return closeRuleEditor();
  if (b.dataset.rp === 'unsel'){
    ruleState.ids = ids.filter(id => id !== b.dataset.id);
    if (ruleState.form) ruleState.form.target = '';
    if (!ruleState.ids.length) return closeRuleEditor();
    markPicked(); return renderRuleEditor();
  }
  if (b.dataset.rp === 'del'){ spec.constraints.splice(+b.dataset.idx, 1); }
  if (b.dataset.rp === 'add'){
    if (b.disabled) return;
    const rel = $('#rpRel').value, target = $('#rpTarget').value, strict = $('#rpStrict').value !== '0';
    spec.constraints = spec.constraints || [];
    ids.forEach(id => {
      if (ruleProblem(spec, {a:id, rel, b:target})) return;   // duplicates, equivalents and contradictions are never added
      spec.constraints.push(strict ? {a:id, rel, b:target} : {a:id, rel, b:target, strict:false});
    });
  }
  persistRules(key); refreshDiagram(key);
});
document.addEventListener('pointerdown', e => {
  if (!ruleState || e.target.closest('#rulePop') || e.target.closest('svg[data-key] .node')) return;
  closeRuleEditor();
});
/* Export every diagram's rules as the JSON "layout" blocks they belong in, keyed "pageId/sectionId". */
function layoutAsJSON(){
  const keys = Object.keys(DIAGRAMS).filter(k => specRules(DIAGRAMS[k]).length);
  if (!keys.length) return '{}';
  return '{\n' + keys.map(k => {
    const rules = specRules(DIAGRAMS[k]).map(r => '      ' + JSON.stringify(r.strict ? {a:r.a, rel:r.rel, b:r.b} : {a:r.a, rel:r.rel, b:r.b, strict:false}).replace(/,"/g, ', "').replace(/":/g, '": '));
    return `  ${JSON.stringify(k)}: {\n    "rules": [\n${rules.join(',\n')}\n    ]\n  }`;
  }).join(',\n') + '\n}';
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; } catch(e){}
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
  ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(e){} ta.remove(); return ok;
}
$('#editbar').addEventListener('click', async e => {
  const b = e.target.closest('[data-eb]'); if (!b) return;
  if (b.dataset.eb === 'done') setEditing(false);
  if (b.dataset.eb === 'copy'){ const txt = layoutAsJSON(); const ok = await copyText(txt); toast(ok ? 'Layout copied — each entry is the "layout" of the diagram section it names (page/section)' : 'Copy failed — see the console'); if (!ok) console.log(txt); }
  if (b.dataset.eb === 'reset' && !b.disabled){
    const k = currentDiagramKey(); if (!k) return;
    discardRules([k]); toast(`Edits discarded on “${PAGE[pageOf(k)].title}”`);
  }
  if (b.dataset.eb === 'reset-all' && !b.disabled) showConfirm(true);
  if (b.dataset.eb === 'commit'){
    const ks = pendingKeys(); ks.forEach(k => saveRules(k));
    toast(`Layout committed on ${ks.length} diagram${ks.length === 1 ? '' : 's'}`);
  }
  if (b.dataset.eb === 'revert'){
    const ks = pendingKeys(); closeRuleEditor();
    ks.forEach(k => { DIAGRAMS[k].constraints = JSON.parse(COMMITTED[k]); refreshDiagram(k); });
    DROP_UNDO.length = 0; updateEditbar(); toast('Uncommitted changes reverted');
  }
  if (b.dataset.eb === 'cancel') showConfirm(false);
  if (b.dataset.eb === 'confirm-all'){
    const keys = editedDiagrams(); showConfirm(false); closeRuleEditor();
    discardRules(keys); toast(`Edits discarded on ${keys.length} diagram${keys.length === 1 ? '' : 's'}`);
  }
});

// live update toggle: remembered per browser; can't be switched off while changes are waiting
$('#ebLive').checked = store.get('arc-live') === '1';
$('#ebLive').addEventListener('change', e => {
  if (!e.target.checked && pendingKeys().length){ e.target.checked = true; nudgePending('Commit or revert your changes before turning live update off'); return; }
  store.set('arc-live', e.target.checked ? '1' : '0');
  toast(e.target.checked ? 'Live update on — the diagram re-lays out as you drag; save with Commit' : 'Live update off — changes are saved as you make them');
});
addEventListener('beforeunload', e => { if (pendingKeys().length){ e.preventDefault(); e.returnValue = ''; } });

// the edit bar can be dragged by its header; its position is remembered, double-click puts it back
(() => {
  const bar = $('#editbar'), head = $('.eb-head', bar);
  const fit = (x, y) => { const r = bar.getBoundingClientRect();
    return [clamp(x, 8, Math.max(8, innerWidth - r.width - 8)), clamp(y, 8, Math.max(8, innerHeight - r.height - 8))]; };
  const place = (x, y) => { [x, y] = fit(x, y); bar.classList.add('moved'); bar.style.left = x + 'px'; bar.style.top = y + 'px'; return [x, y]; };
  const reset = () => { bar.classList.remove('moved'); bar.style.left = bar.style.top = ''; try { localStorage.removeItem('arc-editbar'); } catch(e){} };
  let saved = null; try { saved = JSON.parse(store.get('arc-editbar')); } catch(e){}
  // apply a remembered spot once the bar is actually showing (it has no size while hidden)
  new MutationObserver(() => { if (!bar.hidden && saved){ place(saved[0], saved[1]); saved = null; } }).observe(bar, {attributes:true, attributeFilter:['hidden']});
  let drag = null;
  head.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const r = bar.getBoundingClientRect();
    drag = {dx:e.clientX - r.left, dy:e.clientY - r.top};
    head.setPointerCapture(e.pointerId); head.classList.add('dragging'); e.preventDefault();
  });
  head.addEventListener('pointermove', e => { if (drag) place(e.clientX - drag.dx, e.clientY - drag.dy); });
  const end = () => { if (!drag) return; drag = null; head.classList.remove('dragging');
    store.set('arc-editbar', JSON.stringify([parseFloat(bar.style.left), parseFloat(bar.style.top)])); };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
  head.addEventListener('dblclick', reset);
  addEventListener('resize', () => { if (bar.classList.contains('moved') && !bar.hidden) place(parseFloat(bar.style.left), parseFloat(bar.style.top)); });
})();

// document identity in the chrome
(() => {
  const d = DATA.document || {};
  $('#sbTitle').textContent = d.title || 'Architecture';
  $('#sbSub').textContent = [d.id, d.version && 'v' + d.version].filter(Boolean).join(' · ');
  if (d.status) $('#topStatus').innerHTML = `<i class="dot"></i>${esc(d.status)}`; else $('#topStatus').remove();
  if (d.version) $('#topVersion').textContent = 'v' + d.version; else $('#topVersion').remove();
})();
buildNav();
route();
</script>
