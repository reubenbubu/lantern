<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Commerce Platform — Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TOKENS
   ========================================================================== */
:root{
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Inter Tight', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --sidebar-w: 288px;
  --topbar-h: 60px;
  --radius: 14px;

  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#F0F2F6; --surface-3:#E8EBF1;
  --border:#E2E6ED; --border-strong:#CBD2DD;
  --text:#0D1424; --text-2:#3A4457; --muted:#6A7386; --faint:#98A0B0;
  --accent:#4A5BD4; --accent-2:#7B5BD6; --accent-soft:rgba(74,91,212,.09); --accent-line:rgba(74,91,212,.35);
  --canvas:#FBFCFD; --node-base:#FFFFFF; --grid:rgba(13,20,36,.075);
  --edge:#8A93A4; --edge-hl:#4A5BD4;
  --on-accent:#FFFFFF; color-scheme:light;
  --sidebar:#FAFBFC; --shadow:0 1px 2px rgba(13,20,36,.04),0 4px 16px -6px rgba(13,20,36,.08);
  --shadow-lg:0 24px 64px -16px rgba(13,20,36,.25);
  --ok:#14915F; --warn:#B7791F; --bad:#C2413B;
  --note:#FFF8E6; --note-line:#E9C46A;

  --c-person:#5552D9; --c-system:#2B6CDE; --c-external:#6B7586; --c-container:#0A8BA3;
  --c-database:#BF7A0B; --c-queue:#8A4BC4; --c-component:#0F8D67;
}
:root[data-theme="dark"]{
  --bg:#090C12; --surface:#0F131B; --surface-2:#141923; --surface-3:#1A202C;
  --border:#1E2531; --border-strong:#2A3241;
  --text:#E8EBF1; --text-2:#B3BBCA; --muted:#7D8799; --faint:#566074;
  --accent:#8C9CFF; --accent-2:#B59CFF; --accent-soft:rgba(140,156,255,.10); --accent-line:rgba(140,156,255,.38);
  --canvas:#0B0F16; --node-base:#0E131C; --grid:rgba(255,255,255,.055);
  --edge:#5B6577; --edge-hl:#A3B0FF;
  --on-accent:#0B0F16; color-scheme:dark;
  --sidebar:#0C1017; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.7);
  --ok:#3CCB8B; --warn:#F2B33D; --bad:#F2716B;
  --note:#1D1A10; --note-line:#6E5A22;

  --c-person:#9A98FF; --c-system:#5C9DFF; --c-external:#8C96A8; --c-container:#34C3D5;
  --c-database:#F1B13F; --c-queue:#BF8BFF; --c-component:#3FD3A0;
}
.k-person{--k:var(--c-person)} .k-system{--k:var(--c-system)} .k-external{--k:var(--c-external)}
.k-container{--k:var(--c-container)} .k-database{--k:var(--c-database)} .k-queue{--k:var(--c-queue)}
.k-component{--k:var(--c-component)}

/* ==========================================================================
   BASE
   ========================================================================== */
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--topbar-h) + 20px)}
body{margin:0;background:var(--bg);color:var(--text);font:400 14.5px/1.65 var(--font);
  font-feature-settings:'cv11','ss01','ss03';-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration:none}
code,.mono{font-family:var(--mono);font-size:.86em}
code{background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:6px;color:var(--text-2)}
::selection{background:var(--accent-line)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ==========================================================================
   SIDEBAR
   ========================================================================== */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:var(--sidebar);color:var(--text);
  border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:40;
  transition:transform .28s cubic-bezier(.2,.8,.2,1)}
body.sb-collapsed .sidebar{transform:translateX(-100%)}
.sb-head{display:flex;align-items:center;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--border)}
.logo{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 18px -6px var(--accent-line)}
.logo svg{width:18px;height:18px}
.sb-title{min-width:0;flex:1}
.sb-title b{display:block;font:600 14px/1.2 var(--font-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-title span{font:500 11px/1.4 var(--mono);color:var(--muted)}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid transparent;
  background:transparent;color:var(--muted);cursor:pointer;flex:none;transition:.15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.icon-btn svg{width:17px;height:17px}
.sb-search{padding:12px 14px 6px}
.sb-search label{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:9px;padding:0 10px;height:34px;color:var(--faint);transition:.15s}
.sb-search label:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.sb-search input{border:0;outline:0;background:transparent;color:var(--text);font:400 13px var(--font);width:100%}
.sb-search kbd{font:500 10.5px var(--mono);border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--muted)}
.sb-nav{flex:1;overflow-y:auto;padding:6px 10px 20px;scrollbar-width:thin}
.nav-label{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:18px 10px 8px}
.nav-top,.nav-seq{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--text-2);
  font-weight:500;font-size:13.5px;position:relative;transition:background .15s,color .15s}
.nav-top svg,.nav-seq svg{width:16px;height:16px;color:var(--muted);flex:none}
.nav-top:hover,.nav-seq:hover{background:var(--surface-2);color:var(--text)}
.nav-seq span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-seq em{font:500 10.5px var(--mono);font-style:normal;color:var(--faint);border:1px solid var(--border);border-radius:6px;padding:0 5px}
.nav-group{margin:2px 0}
.nav-ghead{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;background:transparent;
  border-radius:8px;cursor:pointer;color:var(--text-2);font-weight:600;font-size:13.5px;text-align:left;transition:.15s}
.nav-ghead:hover{background:var(--surface-2);color:var(--text)}
.nav-ghead .chev{margin-left:auto;width:14px;height:14px;color:var(--faint);transition:transform .2s}
.nav-group.open .chev{transform:rotate(90deg)}
.lvl{font:600 10px/1 var(--mono);padding:4px 5px;border-radius:5px;color:var(--accent);background:var(--accent-soft);
  border:1px solid var(--accent-line);letter-spacing:.02em}
.nav-gbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.nav-group.open .nav-gbody{grid-template-rows:1fr}
.nav-gbody>div{overflow:hidden}
.nav-gbody .inner{margin:2px 0 6px 21px;padding-left:10px;border-left:1px solid var(--border)}
.nav-sec,.nav-sub{display:block;padding:5px 10px;border-radius:7px;font-size:13px;color:var(--muted);position:relative;transition:.15s}
.nav-sec:hover,.nav-sub:hover{color:var(--text);background:var(--surface-2)}
.nav-sub{font-weight:600;color:var(--text-2);margin-top:6px;font-size:12.5px}
.nav-sub+.nav-sec{margin-top:0}
.nav-sec.active,.nav-top.active,.nav-seq.active{color:var(--accent);background:var(--accent-soft)}
.nav-sec.active::before{content:'';position:absolute;left:-11px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--accent)}
.nav-seq.active svg,.nav-top.active svg{color:var(--accent)}
.nav-group.current>.nav-ghead{color:var(--text)}
.nav-hidden{display:none!important}
.sb-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.sb-foot{position:relative}
.theme-btn{flex:1;display:flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:.15s;text-align:left}
.theme-btn:hover,.theme-btn[aria-expanded="true"]{border-color:var(--border-strong);box-shadow:var(--shadow)}
.tlabel{flex:1;min-width:0;line-height:1.2}
.tlabel small{display:block;font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.tlabel b{display:block;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchev{width:14px;height:14px;color:var(--faint);transition:transform .2s}
.theme-btn[aria-expanded="false"] .tchev{transform:rotate(180deg)}
.tprev{width:34px;height:26px;border-radius:7px;flex:none;position:relative;overflow:hidden;border:1px solid rgba(128,128,128,.28)}
.tprev i{position:absolute}
.tprev .a{left:5px;top:5px;width:14px;height:4px;border-radius:2px}
.tprev .b{left:5px;top:12px;width:8px;height:8px;border-radius:2px}
.tprev .c{left:15px;top:12px;width:8px;height:8px;border-radius:2px}
.tprev .d{left:25px;top:12px;width:4px;height:8px;border-radius:2px}
.theme-pop{position:absolute;left:10px;right:10px;bottom:calc(100% + 8px);background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;
  box-shadow:var(--shadow-lg);padding:8px;max-height:min(560px,70vh);overflow-y:auto;z-index:60;animation:popIn .16s ease both;scrollbar-width:thin}
.theme-pop[hidden]{display:none}
@keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.theme-pop .tg{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:8px 8px 6px}
.titem{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:0;background:transparent;border-radius:9px;cursor:pointer;text-align:left;font-size:13px;color:var(--text-2)}
.titem:hover,.titem:focus-visible{background:var(--surface-2);color:var(--text);outline:0}
.titem.on{color:var(--accent);background:var(--accent-soft)}
.titem span:not(.tprev){flex:1;white-space:nowrap}
.titem .ck{width:14px;height:14px;opacity:0}
.titem.on .ck{opacity:1}
.titem kbd{font:500 10px var(--mono);color:var(--faint)}

/* ==========================================================================
   MAIN / TOPBAR
   ========================================================================== */
.main{margin-left:var(--sidebar-w);min-height:100vh;transition:margin-left .28s cubic-bezier(.2,.8,.2,1)}
body.sb-collapsed .main{margin-left:0}
.topbar{position:sticky;top:0;z-index:30;height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 28px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--border)}
.open-sb{display:none}
body.sb-collapsed .open-sb{display:grid}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0;flex:0 1 auto;max-width:34%}
.crumbs span{white-space:nowrap}
.tabs{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 4px;
  mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 14px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs[hidden]{display:none}
.tabs a{flex:none;position:relative;font-size:13px;font-weight:500;color:var(--muted);padding:7px 11px;border-radius:8px;white-space:nowrap;transition:color .15s,background .15s}
.tabs a:hover{color:var(--text);background:var(--surface-2)}
.tabs a.active{color:var(--accent);background:var(--accent-soft)}
.tabs a.active::after{content:'';position:absolute;left:11px;right:11px;bottom:-11px;height:2px;border-radius:2px;background:var(--accent)}
.nav-solo{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--text-2);font-weight:600;font-size:13.5px;transition:.15s;margin:2px 0}
.nav-solo:hover{background:var(--surface-2);color:var(--text)}
.nav-solo.active{background:var(--accent-soft);color:var(--accent)}
.nav-solo-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.nav-solo-t small{font-weight:500;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-count{margin-left:auto;font:500 10.5px var(--mono);font-style:normal;color:var(--faint);border:1px solid var(--border);border-radius:6px;padding:0 5px}
.nav-count+.chev{margin-left:6px}
.nav-sec.active{color:var(--accent);background:var(--accent-soft)}
.crumbs b{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs svg{width:12px;height:12px;color:var(--faint);flex:none}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:7px;font:500 11.5px var(--mono);color:var(--text-2);background:var(--surface);
  border:1px solid var(--border);border-radius:999px;padding:4px 10px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.content{width:100%;padding:36px clamp(20px,3vw,56px) 80px}
.view{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* page header */
.page-head{padding:6px 0 26px;border-bottom:1px solid var(--border);margin-bottom:8px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.page-head h1{font:700 34px/1.15 var(--font-display);letter-spacing:-.025em;margin:12px 0 10px}
.page-head p{margin:0;color:var(--text-2);max-width:780px;font-size:15.5px}
.page-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}

/* sections */
.sec{padding:34px 0 8px}
.sec-head{margin-bottom:16px}
.sec-head h2{font:650 22px/1.25 var(--font-display);font-weight:650;letter-spacing:-.018em;margin:8px 0 0;display:flex;align-items:center;gap:10px}
.sec-head h2 .anchor{opacity:0;color:var(--faint);font:500 16px var(--mono);transition:.15s}
.sec-head h2:hover .anchor{opacity:1}
.sec p,.prose p{color:var(--text-2);max-width:820px}
.prose p:first-child{margin-top:0}
.prose ul{max-width:820px}
.sec-cont{margin-top:16px}
.page-head .lead{color:var(--text-2);max-width:780px;font-size:15.5px}
.page-head .lead p{margin:0 0 6px}
.hero-sub{font-size:16.5px;color:var(--text-2);max-width:680px}
.hero-sub p{margin:0}
.stats-compact .stat b{font-size:19px}
.stats-text .stat b{font:500 14px/1.5 var(--font);color:var(--text);margin-top:8px;letter-spacing:0}
.callout.tone-warning{background:color-mix(in srgb,var(--warn) 9%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.callout.tone-warning svg{color:var(--warn)}
.callout.tone-success{background:color-mix(in srgb,var(--ok) 9%,transparent);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.callout.tone-success svg{color:var(--ok)}
.callout p{margin:0}
.sec p.lead-sm{font-size:15px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:16px 18px}
.stat small{display:block;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:650 26px/1.2 var(--font-display);font-weight:650;letter-spacing:-.02em;margin:8px 0 2px}
.stat span{font-size:12.5px;color:var(--muted)}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--text-2);font-size:13.5px;max-width:900px}
.callout svg{width:18px;height:18px;flex:none;color:var(--accent);margin-top:2px}
ul.clean{margin:0;padding:0;list-style:none}
ul.ticks li{position:relative;padding-left:22px;margin:6px 0;color:var(--text-2)}
ul.ticks li::before{content:'';position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--accent);opacity:.75;transform:rotate(45deg)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:600 10.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;
  padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text-2)}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
td.mono{font-family:var(--mono);font-size:12px;color:var(--text-2);white-space:nowrap}
.elname{display:flex;gap:11px;align-items:flex-start;min-width:200px}
.elname b{display:block;color:var(--text);font-weight:600;font-size:13.5px}
.elname small{display:block;font:500 10.5px var(--mono);color:var(--muted);letter-spacing:.04em;margin-top:1px}
.kdot{width:10px;height:10px;border-radius:3px;margin-top:5px;flex:none;background:var(--k);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 18%,transparent)}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 10.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;white-space:nowrap;border:1px solid}
.b-high{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.b-med{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.b-low,.b-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.b-info{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.drill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;white-space:nowrap;padding:4px 10px;border-radius:7px;
  border:1px solid var(--accent-line);background:var(--accent-soft)}
.drill:hover{background:var(--accent);color:var(--on-accent)}
.drill svg{width:13px;height:13px}
tr.flash td{animation:flash 2.2s ease}
@keyframes flash{0%,35%{background:color-mix(in srgb,var(--accent) 16%,transparent)}100%{background:transparent}}

/* ADR list */
.adr{display:grid;grid-template-columns:88px 1fr auto;gap:16px;align-items:start;padding:16px 18px;border-bottom:1px solid var(--border)}
.adr:last-child{border-bottom:0}
.adr .id{font:600 12px var(--mono);color:var(--muted);padding-top:2px}
.adr b{display:block;font-weight:600;color:var(--text);margin-bottom:3px}
.adr p{margin:0;font-size:13.5px;color:var(--text-2)}

/* ==========================================================================
   DIAGRAM CARD
   ========================================================================== */
.dcard{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.dbar{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--border)}
.dtitle{display:flex;align-items:center;gap:12px;min-width:0}
.dtitle .lvl{font-size:11px;padding:5px 7px}
.dtitle b{display:block;font:600 14px/1.3 var(--font-display);letter-spacing:-.01em}
.dtitle span{display:block;font:500 11.5px var(--mono);color:var(--muted)}
.dtools{margin-left:auto;display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px}
.dtools .icon-btn{width:30px;height:28px}
.dtools .icon-btn:hover{background:var(--surface)}
.dtools .sep{width:1px;height:16px;background:var(--border-strong);margin:0 3px}
.dcanvas{position:relative;height:clamp(400px,calc(100vh - 292px),860px);background-color:var(--canvas);
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:22px 22px;overflow:hidden}
.dcanvas>svg,.mx-canvas>svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
svg.panning{cursor:grabbing}
.dlegend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:11px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.dlegend .lg{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.sw{width:16px;height:11px;border-radius:3px;background:color-mix(in srgb,var(--k) 18%,var(--surface));border:1.5px solid var(--k)}
.sw.ext{border-style:dashed;--k:var(--muted)}
.sw.line{height:0;border:0;border-top:1.6px solid var(--edge);border-radius:0;background:none;width:20px}
.sw.dash{height:0;border:0;border-top:1.6px dashed var(--edge);border-radius:0;background:none;width:20px}
.sw.clk{width:14px;height:14px;border-radius:50%;border:0;background:var(--accent);display:grid;place-items:center}
.sw.clk::after{content:'';width:4px;height:4px;border-top:1.5px solid #fff;border-right:1.5px solid #fff;transform:translate(-.5px,.5px) rotate(45deg)}
.dlegend .hint{margin-left:auto;font:500 11px var(--mono);color:var(--faint)}

/* svg content */
svg text{font-family:var(--font)}
.node .shape{fill:color-mix(in srgb,var(--k) 9%,var(--node-base));stroke:color-mix(in srgb,var(--k) 62%,transparent);stroke-width:1.5}
.node .lip{fill:none;stroke:color-mix(in srgb,var(--k) 62%,transparent);stroke-width:1.5}
.node.ext .shape,.node.ext .lip{stroke-dasharray:5 4;fill:color-mix(in srgb,var(--k) 4%,var(--node-base))}
.node.hero .shape{fill:color-mix(in srgb,var(--k) 14%,var(--node-base));stroke:var(--k);stroke-width:2}
.node .tagbg{fill:color-mix(in srgb,var(--k) 15%,transparent)}
.node .tag{font:600 9.5px var(--mono);letter-spacing:.09em;fill:var(--k);text-transform:uppercase}
.node .nm{font-weight:600;font-size:14px;fill:var(--text);letter-spacing:-.005em}
.node.hero .nm{font-size:19px;font-family:var(--font-display);letter-spacing:-.015em}
.node .tc{font:500 10.5px var(--mono);fill:var(--muted)}
.node .ds{font-size:11.5px;fill:var(--text-2)}
.node .head{fill:var(--k)}
.node .glyph{fill:var(--node-base)}
.node .lk circle{fill:var(--accent);opacity:.9}
.node .lk path{stroke:var(--on-accent);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.node.link{cursor:pointer}
.node{transition:opacity .2s}
body:not(.editing) .node.link:hover .shape, body.editing svg:not([data-key]) .node.link:hover .shape, body.editing svg[data-key=""] .node.link:hover .shape{stroke:var(--k);stroke-width:2;fill:color-mix(in srgb,var(--k) 15%,var(--node-base))}
.node.link:hover .lk circle{opacity:1}
.edge .ln{fill:none;stroke:var(--edge);stroke-width:1.5;transition:stroke .2s,opacity .2s}
.edge .lbl rect{fill:var(--canvas);stroke:var(--border-strong);stroke-width:1}
.edge .lbl .t1{font-size:11.5px;font-weight:500;fill:var(--text-2)}
.edge .lbl .t2{font:500 10px var(--mono);fill:var(--muted)}
.arrow{fill:var(--edge)} .arrow-hl{fill:var(--edge-hl)}
svg.dim .node:not(.hl){opacity:.32}
svg.dim .edge:not(.hl){opacity:.18}
svg.dim .boundary{opacity:.6}
.edge.hl .ln{stroke:var(--edge-hl);stroke-width:2}
.edge.hl .lbl rect{stroke:var(--edge-hl)}
.edge.hl .lbl .t1{fill:var(--text)}
.boundary rect{fill:color-mix(in srgb,var(--k) 3%,transparent);stroke:color-mix(in srgb,var(--k) 55%,transparent);stroke-width:1.4;stroke-dasharray:7 5}
.boundary .bn{font:600 13px var(--font-display);fill:var(--k);letter-spacing:-.01em}
.boundary .bt{font:500 10.5px var(--mono);fill:var(--muted)}
.boundary.link{cursor:pointer}
.boundary.link:hover .bn{text-decoration:underline}

/* container-page pills inside a node */
.npill{cursor:pointer}
.npill rect{fill:color-mix(in srgb,var(--k) 12%,var(--node-base));stroke:color-mix(in srgb,var(--k) 55%,transparent);stroke-width:1.2;transition:fill .15s,stroke .15s}
.npill text{font:600 11px var(--font);fill:var(--k);pointer-events:none}
.npill path{fill:none;stroke:var(--k);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;opacity:.8}
.npill:hover rect{fill:var(--k);stroke:var(--k)}
.npill:hover text{fill:var(--on-accent)} .npill:hover path{stroke:var(--on-accent);opacity:1}
body.editing svg[data-key]:not([data-key=""]) .npill{pointer-events:none}

/* edit mode */
.node .ed{display:none;cursor:pointer}
.node .ed circle:first-child{fill:var(--node-base);stroke:var(--accent-2);stroke-width:1.5}
.node .ed path{stroke:var(--accent-2);stroke-width:1.4;stroke-linecap:round}
.node .ed .knob{fill:var(--node-base);stroke:var(--accent-2);stroke-width:1.3}
.node .ed.on circle:first-child{fill:var(--accent-2)}
.node .ed.on path{stroke:var(--on-accent)} .node .ed.on .knob{fill:var(--accent-2);stroke:var(--on-accent)}
body.editing svg[data-key]:not([data-key=""]) .node .ed{display:block}
body.editing svg[data-key]:not([data-key=""]) .node .lk{display:none}
body.editing svg[data-key]:not([data-key=""]) .node{cursor:pointer}
body.editing svg[data-key]:not([data-key=""]) .node.picked .shape{stroke:var(--accent-2);stroke-width:2.4;stroke-dasharray:7 5}
body.editing .dcard[data-kind="c4"]{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent-2) 55%,transparent),var(--shadow)}
body.editing svg[data-key]:not([data-key=""]) .node{cursor:grab}
svg.dragmode{cursor:grabbing}
svg.dragmode .edge{opacity:.25}
svg.dragmode .node:not(.dragging):not(.drop-target){opacity:.55}
.node.dragging{cursor:grabbing;opacity:.35}
.node.dragging .shape{stroke:var(--accent-2);stroke-width:2.4}
.node.drop-target .shape{stroke:var(--accent-2);stroke-width:2.4;fill:color-mix(in srgb,var(--accent-2) 10%,var(--node-base))}
.boundary.drop-target rect{stroke:var(--accent-2);stroke-width:2.4;stroke-dasharray:none}
.drop-edge{stroke:var(--accent-2);stroke-width:5;stroke-linecap:round;stroke-dasharray:10 9;pointer-events:none;animation:edgeMarch .6s linear infinite}
@keyframes edgeMarch{to{stroke-dashoffset:-19}}
@media (prefers-reduced-motion:reduce){.drop-edge{animation:none}}
.drop-ghost{fill:color-mix(in srgb,var(--accent-2) 10%,transparent);stroke:var(--accent-2);stroke-width:1.6;stroke-dasharray:6 5;pointer-events:none}
.dcanvas.busy svg,.mx-canvas.busy svg{opacity:.45;transition:opacity .15s}
.editbar{position:fixed;left:calc(var(--sidebar-w) + 16px);top:50%;translate:0 -50%;z-index:150;display:flex;flex-direction:column;align-items:stretch;gap:8px;
  width:216px;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--border-strong);box-shadow:var(--shadow-lg);animation:popIn .2s ease both;
  max-height:calc(100vh - 24px);overflow-y:auto;scrollbar-width:thin;transition:left .28s cubic-bezier(.2,.8,.2,1)}
.editbar[hidden]{display:none}
body.sb-collapsed .editbar{left:16px}
@media (max-width:900px){.editbar{left:16px}}
.editbar.moved{translate:none;transition:none}
.eb-toggle{position:relative;display:flex;align-items:center;gap:10px;padding:4px 4px 6px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text);user-select:none}
.eb-toggle input{position:absolute;opacity:0;pointer-events:none}
.eb-toggle small{display:block;font-size:11px;font-weight:400;color:var(--muted);line-height:1.35}
.eb-switch{width:30px;height:18px;border-radius:9px;background:var(--surface-3);border:1px solid var(--border-strong);position:relative;flex:none;transition:background .15s,border-color .15s}
.eb-switch::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:left .15s,background .15s}
.eb-toggle input:checked + .eb-switch{background:var(--accent-2);border-color:transparent}
.eb-toggle input:checked + .eb-switch::after{left:14px;background:var(--on-accent)}
.eb-toggle input:focus-visible + .eb-switch{outline:2px solid var(--accent);outline-offset:2px}
.eb-pending{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:10px;background:color-mix(in srgb,var(--warn) 9%,transparent);border:1px solid color-mix(in srgb,var(--warn) 38%,transparent)}
.eb-pending[hidden]{display:none}
.eb-pending.nudge{animation:nudge .45s ease}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.eb-btn.commit{background:var(--ok);border-color:transparent;color:var(--on-accent);font-weight:600}
.eb-btn.commit:hover{filter:brightness(1.07);color:var(--on-accent)}
svg.dragmode.live .node:not(.dragging){opacity:1}
svg.dragmode.live .edge{opacity:.55}
.node.preview-me .shape{stroke:var(--accent-2);stroke-width:2.4;stroke-dasharray:7 5;fill:color-mix(in srgb,var(--accent-2) 10%,var(--node-base))}
.eb-head{display:flex;align-items:flex-start;gap:10px;padding:2px 2px 10px;margin-bottom:2px;border-bottom:1px solid var(--border);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.eb-head.dragging{cursor:grabbing}
.eb-grip{width:14px;height:14px;flex:none;color:var(--faint);margin-top:1px}
.eb-head:hover .eb-grip{color:var(--muted)}
.eb-head .eb-dot{margin-top:4px;flex:none}
.eb-dot{width:9px;height:9px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent-2) 22%,transparent);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent-2) 8%,transparent)}}
.eb-text{display:flex;flex-direction:column;line-height:1.25;margin-right:6px;min-width:0}
.eb-text b{font-size:13px} .eb-text span{font-size:11.5px;line-height:1.4;color:var(--muted);margin-top:3px}
.eb-text{flex:1 1 auto;margin-right:0} #editbar.confirming .eb-text span{display:none}
#editbar.confirming [data-eb="copy"]{display:none}
.eb-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);border-radius:9px;height:32px;padding:0 12px;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.eb-btn:hover{color:var(--text);border-color:var(--border-strong)}
.eb-btn[disabled]{opacity:.45;cursor:not-allowed}
.eb-btn[disabled]:hover{color:var(--text-2);border-color:var(--border)}
.eb-group{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.eb-group[hidden]{display:none}
.eb-q{font-size:12.5px;font-weight:500;color:var(--text);line-height:1.4;padding:2px 2px 0}
.eb-btn.danger{background:var(--bad);border-color:transparent;color:#fff}
.eb-btn.danger:hover{filter:brightness(1.08);color:#fff}
.eb-btn.primary{background:var(--accent-2);border-color:transparent;color:var(--on-accent)}
.eb-btn.primary:hover{filter:brightness(1.07);color:var(--on-accent)}
.eb-btn kbd{font:500 10px var(--mono);opacity:.75;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.rule-pop{position:fixed;z-index:160;width:400px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow-lg);animation:popIn .16s ease both;overflow:hidden}
.rule-pop[hidden]{display:none}
.rp-head{display:flex;align-items:center;gap:10px;padding:13px 14px 12px 16px;border-bottom:1px solid var(--border)}
.rp-head .kdot{margin-top:0}
.rp-head{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}
.rp-head.dragging{cursor:grabbing}
.rp-title{flex:1;min-width:0}
.rp-count{min-width:22px;height:22px;padding:0 6px;border-radius:7px;display:grid;place-items:center;background:var(--accent-2);color:var(--on-accent);font:600 11.5px var(--mono)}
.rp-chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}
.rp-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px 4px 3px 10px}
.rp-chip i{width:8px;height:8px;border-radius:2px;background:var(--k)}
.rp-chip button{border:0;background:transparent;color:var(--faint);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0}
.rp-chip button:hover{background:var(--surface-3);color:var(--bad)}
.rp-chip button svg{width:11px;height:11px}
.rp-head b{font-size:14px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-head small{display:block;font:500 10.5px var(--mono);color:var(--muted);font-weight:500}
.rp-sec{padding:12px 16px}
.rp-sec+.rp-sec{border-top:1px solid var(--border)}
.rp-label{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.rp-rule{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;color:var(--text-2);margin-bottom:6px}
.rp-rule span{flex:1;min-width:0}
.rp-rule b{color:var(--text);font-weight:600}
.rp-rule em{font-style:normal;font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 12%,transparent)}
.rp-rule em.soft{color:var(--muted);background:var(--surface-3)}
.rp-rule.edit{align-items:flex-start;padding:8px 6px 8px 10px}
.rp-inline{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:5px 5px;font-size:13px;color:var(--text-2)}
.rp-inline b{color:var(--text);font-weight:600;margin-right:2px}
.rp-inline select{font:500 12.5px var(--font);color:var(--text);background-color:var(--surface);border:1px solid var(--border);border-radius:7px;
  height:27px;padding:0 24px 0 8px;cursor:pointer;appearance:none;-webkit-appearance:none;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat;transition:border-color .15s}
.rp-inline select:hover{border-color:var(--border-strong)}
.rp-inline select:focus{outline:0;border-color:var(--accent-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-2) 18%,transparent)}
.rp-inline select[data-field="strict"]{color:var(--accent-2);font-weight:600}
.rp-inline .warn{flex-basis:100%}
.rp-rule.edit .rp-x{margin-top:2px}
.rp-rule.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.rp-rule .warn{display:block;font-size:11.5px;color:var(--bad);margin-top:2px}
.rp-x{border:0;background:transparent;color:var(--faint);width:24px;height:24px;border-radius:6px;cursor:pointer;display:grid;place-items:center;flex:none}
.rp-x:hover{background:var(--surface-3);color:var(--bad)}
.rp-x svg{width:14px;height:14px}
.rp-empty{font-size:13px;color:var(--muted)}
.rp-sentence{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;font-size:13.5px;color:var(--text-2)}
.rp-sentence b{color:var(--text);font-weight:600}
.rp-sentence select{font:500 13px var(--font);color:var(--text);background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;
  height:32px;padding:0 28px 0 10px;cursor:pointer;appearance:none;-webkit-appearance:none;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.rp-sentence select:focus{outline:0;border-color:var(--accent-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent-2) 18%,transparent)}
.rp-hint{margin-top:10px;font-size:12px;line-height:1.45;color:var(--muted);padding:7px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}
.rp-hint[hidden]{display:none}
.rp-hint.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,transparent);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.rp-hint b{color:var(--text);font-weight:600}
.rp-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.rp-actions small{font-size:11.5px;color:var(--faint)}
.rp-add{white-space:nowrap;flex:none;border:0;background:var(--accent-2);color:var(--on-accent);font:600 12.5px var(--font);height:32px;padding:0 14px;border-radius:9px;cursor:pointer}
.rp-add:hover{filter:brightness(1.07)}
.rp-add[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,8px);z-index:170;background:var(--text);color:var(--bg);font:500 12.5px var(--font);
  padding:8px 14px;border-radius:9px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* sequence */
.seq .lifeline{stroke:var(--border-strong);stroke-width:1.2;stroke-dasharray:4 5}
.seq .act{fill:color-mix(in srgb,var(--k) 22%,var(--node-base));stroke:color-mix(in srgb,var(--k) 70%,transparent);stroke-width:1.2}
.seq .msg{fill:none;stroke:var(--text-2);stroke-width:1.4}
.seq .msg.ret{stroke:var(--muted);stroke-dasharray:5 4}
.seq .msg.async{stroke:var(--text-2)}
.seq .marrow{fill:var(--text-2)} .seq .marrow-o{fill:none;stroke:var(--text-2);stroke-width:1.4} .seq .marrow-r{fill:none;stroke:var(--muted);stroke-width:1.4}
.seq .mlbl rect{fill:var(--canvas);opacity:.92}
.seq .mt{font-size:12.5px;font-weight:500;fill:var(--text)}
.seq .mt.r{fill:var(--text-2);font-weight:400}
.seq .mc{font:500 11px var(--mono);fill:var(--accent)}
.seq .num circle{fill:var(--accent)} .seq .num text{font:600 9.5px var(--mono)}
.seq .num text{fill:var(--on-accent)}
.seq .frame rect.fb{fill:color-mix(in srgb,var(--accent) 3%,transparent);stroke:var(--accent-line);stroke-width:1.2}
.seq .frame .ftab{fill:color-mix(in srgb,var(--accent) 14%,var(--node-base));stroke:var(--accent-line);stroke-width:1.2}
.seq .frame .fk{font:700 11px var(--mono);fill:var(--accent);letter-spacing:.04em}
.seq .frame .fg{font:500 11.5px var(--mono);fill:var(--text-2)}
.seq .frame .fgbg{fill:var(--canvas)}
.seq .frame .fsep{stroke:var(--accent-line);stroke-width:1.2;stroke-dasharray:6 4}
.seq .note rect{fill:var(--note);stroke:var(--note-line);stroke-width:1.2}
.seq .note text{font-size:12px;fill:var(--text-2);font-style:italic}

/* steps table in sequences */
.step-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);font:600 10.5px var(--mono)}
.step-n{color:var(--on-accent)}
.flow{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.flow svg{width:13px;height:13px;color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text)}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--k)}

/* ==========================================================================
   MAXIMIZE OVERLAY
   ========================================================================== */
.mx{position:fixed;inset:0 0 0 var(--sidebar-w);z-index:100;transition:left .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;background:var(--canvas);
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:24px 24px;animation:mxIn .22s ease both}
.mx[hidden]{display:none}
body.sb-collapsed .mx{left:0}
@keyframes mxIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.mx-bar .open-sb{margin-right:-4px}
.mx-bar{display:flex;align-items:center;gap:16px;padding:10px 14px 10px 20px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.mx-bar .dlegend{border:0;padding:0;flex:1;justify-content:center}
.mx-bar .dlegend .hint{display:none}
.mx-canvas{flex:1;min-height:0;position:relative}
.mx-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font:500 11.5px var(--mono);color:var(--muted);
  background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);pointer-events:none}
.close-btn{border:1px solid var(--border);background:var(--surface);border-radius:9px;height:32px;padding:0 12px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text-2)}
.close-btn:hover{color:var(--text);border-color:var(--border-strong)}
.close-btn kbd{font:500 10.5px var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:0 5px}

.tip{position:fixed;z-index:200;pointer-events:none;background:var(--text);color:var(--bg);font:500 12px var(--font);padding:6px 10px;border-radius:8px;
  box-shadow:var(--shadow-lg);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:nowrap}
.tip.on{opacity:1;transform:none}
.tip span{opacity:.6;font-family:var(--mono);font-size:10.5px;margin-left:6px}

/* ==========================================================================
   HOME
   ========================================================================== */
.hero{position:relative;padding:54px 44px 46px;border-radius:22px;overflow:hidden;border:1px solid var(--border);
  background:radial-gradient(1200px 400px at 85% -20%,color-mix(in srgb,var(--accent-2) 18%,transparent),transparent 60%),
             radial-gradient(900px 380px at 0% 120%,color-mix(in srgb,var(--c-container) 14%,transparent),transparent 60%),var(--surface)}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 30%,#000 10%,transparent 70%)}
.hero>*{position:relative}
.hero h1{font:700 46px/1.06 var(--font-display);letter-spacing:-.035em;margin:16px 0 14px;max-width:760px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:16.5px;color:var(--text-2);max-width:680px;margin:0}
.hero .page-meta{margin-top:26px}
.hero-art{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:300px;opacity:.95}
.lcard{padding:22px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s,transform .2s,box-shadow .2s}
.lcard:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.lcard-top{display:flex;align-items:center;gap:14px}
.lcard-top .art{width:54px;height:54px;flex:none;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center}
.lcard-top .art svg{width:36px;height:36px}
.lcard h3{margin:0;font:650 17px/1.25 var(--font-display);font-weight:650;letter-spacing:-.015em}
.lcard h3 a{color:var(--text)}
.lcard h3 a:hover{color:var(--accent)}
.lcard .sub{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lcard p{margin:0;font-size:13.5px;color:var(--text-2)}
.links{display:flex;flex-direction:column;border-top:1px solid var(--border);padding-top:8px;margin-top:auto}
.links a{display:flex;align-items:center;gap:10px;padding:6px 2px;color:var(--text-2);font-size:13.5px;border-radius:6px}
.links a::after{content:'→';margin-left:auto;color:var(--faint);transition:transform .15s,color .15s}
.links a:hover{color:var(--accent)} .links a:hover::after{color:var(--accent);transform:translateX(3px)}
.links .grp{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:8px 2px 2px}
.notation{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ncard{padding:16px;display:flex;gap:14px;align-items:flex-start}
.ncard svg{width:58px;height:42px;flex:none}
.ncard b{display:block;font-size:13.5px;font-weight:600}
.ncard span{display:block;font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.seqcard{padding:18px 20px;display:flex;align-items:center;gap:16px;transition:.2s;color:inherit}
.seqcard:hover{border-color:var(--accent-line);box-shadow:var(--shadow-lg)}
.seqcard .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.seqcard .ic svg{width:20px;height:20px}
.seqcard b{display:block;font-weight:600;color:var(--text);font-size:14.5px}
.seqcard span{display:block;font-size:12.5px;color:var(--muted)}
.seqcard .go{margin-left:auto;color:var(--faint);font-size:18px;transition:.2s}
.seqcard:hover .go{color:var(--accent);transform:translateX(3px)}

/* pager */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:56px;padding-top:26px;border-top:1px solid var(--border)}
.pager a{padding:16px 18px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);transition:.2s}
.pager a:hover{border-color:var(--accent-line);box-shadow:var(--shadow)}
.pager a small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.pager a b{font-weight:600}
.pager .next{text-align:right;grid-column:2}
.footer{margin-top:40px;font:500 11.5px var(--mono);color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* responsive */
.scrim{display:none}
@media (max-width:1100px){.g4,.notation{grid-template-columns:repeat(2,minmax(0,1fr))} .hero-art{display:none}}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg)}
  body.sb-open .sidebar{transform:none}
  .main{margin-left:0!important}
  .mx{left:0!important}
  body.sb-open .sidebar{z-index:120} body.sb-open .scrim{z-index:110!important}
  .open-sb{display:grid!important}
  body.sb-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .content{padding:24px 18px 60px} .topbar{padding:0 16px}
  .crumbs{display:none} .top-right .pill{display:none}
  [class*="stats-"]{grid-template-columns:1fr!important}
  .g2,.g3{grid-template-columns:1fr} .hero{padding:34px 24px} .hero h1{font-size:34px}
  .dlegend .hint{display:none}
}
@media print{.sidebar,.topbar,.dtools,.pager{display:none!important}.main{margin:0!important}}

    {

    {
      "id": "seq-checkout",
      "level": "sequence",
      "title": "Checkout & Place Order",
      "summary": "A signed-in customer submits their cart. The order is priced, payment is authorised synchronously and an order.placed event is published.",
      "sections": [
        {
          "type": "stats",
          "id": "overview",
          "eyebrow": "Context",
          "title": "Overview",
          "columns": 3,
          "variant": "text",
          "items": [
            {
              "label": "Trigger",
              "value": "Customer clicks “Place order”"
            },
            {
              "label": "Pre-conditions",
              "value": "Customer is authenticated; cart is non-empty"
            },
            {
              "label": "Post-conditions",
              "value": "Order persisted as PLACED; event published"
            }
          ]
        },
        {
          "type": "sequence",
          "id": "diagram",
          "eyebrow": "Diagram",
          "title": "Sequence Diagram",
          "participants": [
            "customer",
            "storefront",
            "gateway",
            "order-svc",
            "payment-svc",
            "kafka"
          ],
          "steps": [
            {
              "from": "customer",
              "to": "storefront",
              "message": "Click “Place order”"
            },
            {
              "from": "storefront",
              "to": "gateway",
              "message": "Submit order",
              "code": "POST /v1/orders"
            },
            {
              "from": "gateway",
              "to": "gateway",
              "message": "Validate JWT & rate-limit"
            },
            {
              "from": "gateway",
              "to": "order-svc",
              "message": "Forward request"
            },
            {
              "from": "order-svc",
              "to": "order-svc",
              "message": "Price cart & reserve stock"
            },
            {
              "from": "order-svc",
              "to": "payment-svc",
              "message": "Authorise payment",
              "code": "Authorise()"
            },
            {
              "from": "payment-svc",
              "to": "order-svc",
              "message": "AUTHORISED",
              "type": "return",
              "info": "See the Payment Authorisation sequence for the internals."
            },
            {
              "frame": "alt",
              "label": "payment authorised"
            },
            {
              "from": "order-svc",
              "to": "kafka",
              "message": "Publish",
              "code": "order.placed",
              "type": "async"
            },
            {
              "from": "order-svc",
              "to": "gateway",
              "message": "201 Created",
              "type": "return",
              "deactivate": false
            },
            {
              "else": "payment declined"
            },
            {
              "from": "order-svc",
              "to": "gateway",
              "message": "402 Payment Required",
              "type": "return"
            },
            {
              "end": true
            },
            {
              "from": "gateway",
              "to": "storefront",
              "message": "Order response",
              "type": "return"
            },
            {
              "from": "storefront",
              "to": "customer",
              "message": "Show confirmation",
              "type": "return"
            }
          ]
        },
        {
          "type": "steps",
          "id": "steps",
          "eyebrow": "Walkthrough",
          "title": "Steps",
          "of": "diagram"
        }
      ]

    {
      "id": "seq-payment",
      "level": "sequence",
      "title": "Payment Authorisation",
      "summary": "Inside Payment Service: the request is de-duplicated, risk-scored and, if acceptable, authorised with Stripe via a PaymentIntent.",
      "sections": [
        {
          "type": "stats",
          "id": "overview",
          "eyebrow": "Context",
          "title": "Overview",
          "columns": 3,
          "variant": "text",
          "items": [
            {
              "label": "Trigger",
              "value": "Order Service calls Authorise()"
            },
            {
              "label": "Pre-conditions",
              "value": "Order priced; idempotency key supplied"
            },
            {
              "label": "Post-conditions",
              "value": "PaymentIntent in requires_capture, or a local decline"
            }
          ]
        },
        {
          "type": "sequence",
          "id": "diagram",
          "eyebrow": "Diagram",
          "title": "Sequence Diagram",
          "participants": [
            "pay-client",
            "grpc-ep",
            "orchestrator",
            "fraud",
            "stripe-adapter",
            "stripe"
          ],
          "steps": [
            {
              "from": "pay-client",
              "to": "grpc-ep",
              "message": "Authorise",
              "code": "(orderId, amount)"
            },
            {
              "from": "grpc-ep",
              "to": "orchestrator",
              "message": "authorise(cmd)"
            },
            {
              "from": "orchestrator",
              "to": "orchestrator",
              "message": "Check idempotency key"
            },
            {
              "from": "orchestrator",
              "to": "fraud",
              "message": "score(payment)"
            },
            {
              "from": "fraud",
              "to": "orchestrator",
              "message": "riskScore = 0.12",
              "type": "return"
            },
            {
              "frame": "alt",
              "label": "risk < 0.80"
            },
            {
              "from": "orchestrator",
              "to": "stripe-adapter",
              "message": "createIntent()"
            },
            {
              "from": "stripe-adapter",
              "to": "stripe",
              "message": "Create intent",
              "code": "POST /v1/payment_intents"
            },
            {
              "from": "stripe",
              "to": "stripe-adapter",
              "message": "requires_capture",
              "type": "return"
            },
            {
              "from": "stripe-adapter",
              "to": "orchestrator",
              "message": "AUTHORISED",
              "type": "return"
            },
            {
              "else": "risk ≥ 0.80"
            },
            {
              "note": "Declined locally — Stripe is never called",
              "over": [
                "orchestrator",
                "fraud"
              ]
            },
            {
              "end": true
            },
            {
              "from": "orchestrator",
              "to": "grpc-ep",
              "message": "AuthResult",
              "type": "return"
            },
            {
              "from": "grpc-ep",
              "to": "pay-client",
              "message": "AuthResponse",
              "type": "return"
            }
          ]
        },
        {
          "type": "steps",
          "id": "steps",
          "eyebrow": "Walkthrough",

const DATA = JSON.parse(document.getElementById('arc-data').textContent);

const KIND = {
  person:{label:'Person', desc:'A human user or role interacting with the system.'},
  system:{label:'Software System', desc:'The system in scope, owned by the documenting team.'},
  external:{label:'External System', desc:'A third-party system outside our ownership.'},

  queue:{label:'Message Broker', desc:'Asynchronous messaging / event streaming.'},
  component:{label:'Component', desc:'A grouping of code inside a container.'},
};
const LEVELS = [
  {id:'context',    badge:'L1',  label:'System Context', card:'System Context diagram', blurb:'The system as a black box: who uses it and which external systems it depends on.'},
  {id:'containers', badge:'L2',  label:'Containers',     card:'Container diagram',      blurb:'Deployable applications, services and data stores, and how they communicate.'},
  {id:'components', badge:'L3',  label:'Components',     card:'Component diagram',      blurb:'The internal structure of individual containers.'},
  {id:'sequence',   badge:'SEQ', label:'Sequence Diagrams', card:'Sequence diagram',    blurb:'Dynamic views of the most important runtime flows.'},
];

/* Elements, normalised for the renderers (tech / desc / props). */
const EL = {};
for (const [id, e] of Object.entries(DATA.elements || {}))
  EL[id] = {...e, tech:e.technology || '', desc:e.description || '', props:e.properties || {}};

const PAGES = (DATA.pages || []).filter(p => LEVEL[p.level]);

const pageOf = key => key.split('/')[0];

/* Diagram and sequence sections → engine specs, keyed "pageId/sectionId". */
const DIAGRAMS = {}, SEQS = {};
for (const p of PAGES) for (const s of (p.sections || [])){
  const key = `${p.id}/${s.id}`;
  if (s.type === 'diagram'){
    // relationships naming unknown elements are skipped (and reported by validate()) so the rest still draws
    const edges = (s.relationships || []).filter(r => EL[r.from] && EL[r.to]).map(r => ({f:r.from, t:r.to, l:r.label || '', tech:r.technology || ''}));
    const ids = new Set([...edges.flatMap(e => [e.f, e.t]), ...(s.elements || []).filter(id => EL[id])]);
    const spec = {level:LEVEL[p.level].badge, title:s.caption || LEVEL[p.level].card, sub:p.title, edges, groupByKind: s.layout?.groupByKind !== false,
      constraints:(s.layout?.rules || []).map(r => r.strict === false ? {a:r.a, rel:r.rel, b:r.b, strict:false} : {a:r.a, rel:r.rel, b:r.b})};
    if ((s.elements || []).some(id => EL[id])) spec.nodes = s.elements.filter(id => EL[id]);
    // only the system the diagram is about is drawn as the large hero box
    const systems = [...ids].filter(id => EL[id] && EL[id].kind === 'system' && id !== s.boundary);
    const focus = s.focus || (systems.length === 1 ? systems[0] : null);
    if (systems.length) spec.nodes = [...(spec.nodes || []).filter(n => !systems.includes(n)), ...systems.map(id => ({id, hero: !s.boundary && id === focus}))];
    spec._focus = focus;
    spec._key = key;
    if (s.boundary) spec.boundary = {id:s.boundary, contains:[...ids].filter(id => EL[id] && EL[id].parent === s.boundary)};
    spec._ids = ids;
    DIAGRAMS[key] = spec;
  }
  if (s.type === 'sequence'){
    SEQS[key] = {title:p.title, p:[...(s.participants || [])], s:(s.steps || []).map(st => {
      if (st.frame) return {frame:st.frame, label:st.label || ''};
      if (st.else !== undefined) return {else:st.else};
      if (st.end) return {end:1};
      if (st.note) return {note:st.over || [], text:st.note};
      const o = {f:st.from, t:st.to, m:st.message || '', c:st.code, info:st.info, k:st.type === 'return' ? 'ret' : st.type === 'async' ? 'async' : 'sync'};
      if (st.activate !== undefined) o.a = st.activate ? 1 : 0;
      if (st.deactivate !== undefined) o.d = st.deactivate ? 1 : 0;
      return o; })};
  }
}

/* Element selection used by catalogue tables: explicit ids, or a filter on kind / parent / tag. */
function selectElements(sel = {}){
  if (sel.ids) return sel.ids.filter(id => EL[id]);
  const any = (v, x) => v == null || [].concat(v).includes(x);
  return Object.keys(EL).filter(id => any(sel.kind, EL[id].kind) && any(sel.parent, EL[id].parent) && any(sel.tag, EL[id].tag));
}
/* Where each element is described: the first catalogue table (in page order) that lists it. */
const CATALOGUE = {};
for (const p of PAGES) for (const s of (p.sections || [])) if (s.type === 'elements')
  for (const id of selectElements(s.select)) if (!CATALOGUE[id]) CATALOGUE[id] = {page:p.id, section:s.id, title:s.title || 'Catalogue'};

/* Boundary frames link back to the diagram where that element appears as a box. */
for (const [key, d] of Object.entries(DIAGRAMS)) if (d.boundary){
  const cands = Object.keys(DIAGRAMS).filter(k => k !== key && DIAGRAMS[k]._ids.has(d.boundary.id) && DIAGRAMS[k].boundary?.id !== d.boundary.id);
  const up = cands.find(k => DIAGRAMS[k]._focus === d.boundary.id) || cands[0];
  if (up){ d.boundary.href = '#/' + up; d.boundary.tip = `Back to ${LEVEL[PAGE[pageOf(up)].level].label} · ${PAGE[pageOf(up)].title}`; }
}

/* Click-through: zoom into the diagram scoped to this element, else open its catalogue row. */
/* Click-through, in order of preference:
   1. a system that isn't this diagram's subject → that system's own context page (same level, its big picture)
   2. an element that has its own deeper diagram → zoom into it
   3. otherwise → its row in the catalogue table that describes it */
function linkFor(id, key){
  if (!EL[id]) return null;
  if (EL[id].kind === 'system' && (!key || !DIAGRAMS[key] || DIAGRAMS[key]._focus !== id)){
    const f = Object.keys(DIAGRAMS).find(k => k !== key && DIAGRAMS[k]._focus === id && !DIAGRAMS[k].boundary);
    if (f){ const p = PAGE[pageOf(f)]; return {href:'#/' + f, tip:'Open its system context', sub:`${LEVEL[p.level].badge} · ${p.title}`, drill:false, ctx:true}; }
  }
  const d = Object.keys(DIAGRAMS).find(k => k !== key && DIAGRAMS[k].boundary?.id === id);
  if (d){ const p = PAGE[pageOf(d)]; return {href:'#/' + d, tip:'Zoom in', sub:`${LEVEL[p.level].badge} · ${p.title}`, drill:true}; }
  const c = CATALOGUE[id];
  if (c){ const p = PAGE[c.page]; return {href:`#/${c.page}/el-${id}`, tip: key && pageOf(key) === c.page ? 'Jump to details' : 'Open details', sub:`${p.title} · ${c.title}`, drill:false}; }
  return null;
}

/* Every deeper diagram scoped to this element (e.g. a system's container pages), in page order. */
function drillTargets(id, key){
  return Object.keys(DIAGRAMS).filter(k => k !== key && DIAGRAMS[k].boundary?.id === id)
    .map(k => ({key:k, href:'#/' + k, title:PAGE[pageOf(k)].title, level:LEVEL[PAGE[pageOf(k)].level]}));
}
/* An element with two or more deeper diagrams gets a row of pills, one per diagram. */
const PILL = {h:22, gap:8, pad:14, w: t => Math.min(210, Math.min(t.length, 26)*6.5 + 40)};
function pillsFor(id, key){ const t = drillTargets(id, key); return t.length >= 2 ? t : []; }
function pillRowWidth(pills){ return pills.reduce((s, p) => s + PILL.w(p.title), 0) + PILL.gap*(pills.length-1); }

/* Validation — reported once in the console so mistakes in the JSON are easy to find. */
(function validate(){
  const issues = [], seenP = new Set();
  const PARENT_OK = {container:['system'], database:['system','container'], queue:['system','container'], component:['container']};
  for (const [id, e] of Object.entries(EL)){
    if (!KIND[e.kind]) issues.push(`element "${id}": unknown kind "${e.kind}"`);
    if (e.parent && !EL[e.parent]) issues.push(`element "${id}": parent "${e.parent}" does not exist`);
    else if (e.parent && PARENT_OK[e.kind] && !PARENT_OK[e.kind].includes(EL[e.parent].kind)) issues.push(`element "${id}": a ${e.kind} cannot sit inside a ${EL[e.parent].kind} ("${e.parent}")`);
  }
  for (const p of DATA.pages || []){
    if (!LEVEL[p.level]) issues.push(`page "${p.id}": unknown level "${p.level}" (use ${LEVELS.map(l=>l.id).join(', ')}) — page skipped`);
    if (seenP.has(p.id)) issues.push(`page id "${p.id}" is used more than once`); seenP.add(p.id);
    const seenS = new Set();
    for (const s of p.sections || []){
      const where = `page "${p.id}" › section "${s.id}"`;
      if (seenS.has(s.id)) issues.push(`${where}: section id used more than once on this page`); seenS.add(s.id);
      if (s.type === 'diagram'){
        for (const r of s.relationships || []) for (const id of [r.from, r.to]) if (!EL[id]) issues.push(`${where}: relationship refers to unknown element "${id}"`);
        if (s.boundary && !EL[s.boundary]) issues.push(`${where}: boundary "${s.boundary}" does not exist`);
        else if (s.boundary && !DIAGRAMS[`${p.id}/${s.id}`].boundary.contains.length) issues.push(`${where}: nothing in this diagram has "${s.boundary}" as its parent, so the boundary would be empty`);
      }
      if (s.type === 'sequence'){
        for (const id of s.participants || []) if (!EL[id]) issues.push(`${where}: participant "${id}" does not exist`);
        for (const st of s.steps || []) for (const id of [st.from, st.to]) if (id && !(s.participants || []).includes(id)) issues.push(`${where}: step uses "${id}", which is not a participant`);
      }
      if (s.type === 'steps' && !SEQS[`${p.id}/${s.of}`]) issues.push(`${where}: "of" must name a sequence section on this page`);
      if (s.type === 'elements') for (const id of s.select?.ids || []) if (!EL[id]) issues.push(`${where}: unknown element "${id}"`);
    }
  }
  if (issues.length){ console.groupCollapsed(`[arc-data] ${issues.length} issue${issues.length>1?'s':''} found in the document data`); issues.forEach(i => console.warn(i)); console.groupEnd(); }
})();

const $ = (s,r=document)=>r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
let UID = 0;

function wrap(text, max, lines){
  const out=[]; let cur='';
  for (const w of String(text).split(/\s+/)){
    if ((cur ? cur+' '+w : w).length > max && cur){ out.push(cur); cur=w; } else cur = cur ? cur+' '+w : w;
  }
  if (cur) out.push(cur);
  if (out.length > lines){ out.length = lines; out[lines-1] = out[lines-1].replace(/[\s,.;:]*$/,'') + '…'; }
  return out;
}

/* Markdown-lite: **bold**, *italic*, `code` (kept literal), [links](url), paragraphs and "- " lists. */
function mdInline(s){
  const spans = [];
  return esc(s).replace(/\u0000/g, '')
    .replace(/`([^`]+)`/g, (m, c) => '\u0000' + (spans.push(c) - 1) + '\u0000')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|#|mailto:)/.test(u) ? `<a href="${u}"${/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : ''}>${t}</a>` : t)
    .replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${spans[i]}</code>`);
}
function md(s){
  return String(s ?? '').trim().split(/\n\s*\n/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^\s*[-*]\s+/.test(l))) return `<ul class="clean ticks">${lines.map(l => `<li>${mdInline(l.replace(/^\s*[-*]\s+/, ''))}</li>`).join('')}</ul>`;
    return `<p>${lines.map(mdInline).join('<br>')}</p>`;
  }).join('');
}

function nodeSVG(n, view, uid, ruled=false){
