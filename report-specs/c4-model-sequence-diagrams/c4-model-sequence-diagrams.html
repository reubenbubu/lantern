             <path class="lip" d="M${x},${y+ry} A${w/2},${ry} 0 0 0 ${x+w},${y+ry}"/>`;
  } else if (k === 'queue'){
    const rx = 13; lkx = x+w-rx-17;
    shape = `<path class="shape" d="M${x+rx},${y} H${x+w-rx} A${rx},${h/2} 0 0 1 ${x+w-rx},${y+h} H${x+rx} A${rx},${h/2} 0 0 1 ${x+rx},${y} Z"/>
             <path class="lip" d="M${x+w-rx},${y} A${rx},${h/2} 0 0 0 ${x+w-rx},${y+h}"/>`;
  } else {
    shape = `<rect class="shape" x="${x}" y="${y}" width="${w}" height="${h}" rx="${k==='person'?20:12}"/>`;
  }
  if (k === 'person'){
    topPad = 12;
    shape += `<circle class="head" cx="${cx}" cy="${y}" r="17"/>
      <circle class="glyph" cx="${cx}" cy="${y-4}" r="5"/><path class="glyph" d="M${cx-8.5},${y+10} a8.5,7.5 0 0 1 17,0 z"/>`;
  }
  const hero = !!n.hero;
  const tag = e.tag || KIND[k].label;
  const descLines = h >= 300 ? 6 : h >= 140 ? 3 : h >= 100 ? 2 : 1;
  const desc = e.desc ? wrap(e.desc, Math.floor((w-(hero?60:26))/(hero?6.6:6.05)), descLines) : [];
  const nameH = hero ? 24 : 18, tech = e.tech;
  const pills = view ? pillsFor(n.id, view) : [];
  const pillArea = pills.length ? PILL.h + 14 : 0;
  const bottomPad = (k === 'database' ? 9 : 0) + pillArea;
  const calcH = () => 18 + 8 + nameH + (tech?16:0) + (desc.length ? 4 + desc.length*(hero?17:13.5) : 0);
  while (desc.length && calcH() > h - topPad - bottomPad - 12) desc.pop();
  if (desc.length && e.desc && wrap(e.desc, 999, 1)[0] !== desc.join(' ') && !desc[desc.length-1].endsWith('…')) desc[desc.length-1] = desc[desc.length-1].replace(/[\s,.;:]*$/,'') + '…';
  const blockH = calcH();
  let ty = y + topPad + (h - topPad - bottomPad - blockH)/2;
  const tagW = tag.length*6.5 + 16;
  let t = `<rect class="tagbg" x="${cx-tagW/2}" y="${ty}" width="${tagW}" height="18" rx="9"/>
           <text class="tag" x="${cx}" y="${ty+12.6}" text-anchor="middle">${esc(tag)}</text>`;
  ty += 26;
  t += `<text class="nm" x="${cx}" y="${ty+(hero?18:13.5)}" text-anchor="middle">${esc(e.name)}</text>`;
  ty += nameH;
  if (tech){ t += `<text class="tc" x="${cx}" y="${ty+11.5}" text-anchor="middle">${esc(tech)}</text>`; ty += 16; }
  desc.forEach((d,i)=> t += `<text class="ds" x="${cx}" y="${ty+4+11.5+i*(hero?17:13.5)}" text-anchor="middle" ${hero?'style="font-size:13px"':''}>${esc(d)}</text>`);
  if (pills.length){
    let px = cx - pillRowWidth(pills)/2;
    const py = y + h - PILL.h - 12 - (k === 'database' ? 9 : 0);
    t += `<g class="npills">` + pills.map(pl => {
      const pw = PILL.w(pl.title), label = pl.title.length > 26 ? pl.title.slice(0,25) + '…' : pl.title;
      const out = `<g class="npill" data-href="${pl.href}" data-tip="Open ${esc(pl.level.label.toLowerCase().replace(/s$/,''))} view" data-sub="${pl.level.badge} · ${esc(pl.title)}">
        <rect x="${px}" y="${py}" width="${pw}" height="${PILL.h}" rx="${PILL.h/2}"/>
        <text x="${px + pw/2 - 6}" y="${py + 15}" text-anchor="middle">${esc(label)}</text>
        <path d="M${px+pw-17},${py+14} l5,-5 M${px+pw-15.5},${py+9} h3.5 v3.5"/></g>`;
      px += pw + PILL.gap; return out;
    }).join('') + `</g>`;
  }
  let icon = '';
  if (lk){
    icon = lk.drill
      ? `<g class="lk" transform="translate(${lkx},${lky})"><circle r="9"/><path d="M-3.5,-1.5 V-3.5 H-1.5 M1.5,-3.5 H3.5 V-1.5 M3.5,1.5 V3.5 H1.5 M-1.5,3.5 H-3.5 V1.5"/></g>`
      : `<g class="lk" transform="translate(${lkx},${lky})"><circle r="8"/><path d="M-2.6,2.6 L2.6,-2.6 M-1.2,-2.6 H2.6 V1.2"/></g>`;
  }
  // edit-mode badge (top-left); filled when the element already has placement rules
  const edx = 2*x + w - lkx;
  icon += `<g class="ed${ruled?' on':''}" transform="translate(${edx},${lky})"><circle r="9"/><path d="M-4,-1.5 H4 M-4,1.5 H4"/><circle class="knob" cx="-1.5" cy="-1.5" r="1.6"/><circle class="knob" cx="1.8" cy="1.5" r="1.6"/></g>`;
  return `<g class="node k-${k}${n.ext?' ext':''}${hero?' hero':''}${lk?' link':''}" data-id="${n.id}"${lk?` data-href="${lk.href}" data-tip="${esc(lk.tip)}" data-sub="${esc(lk.sub)}"`:''}>${shape}${t}${icon}</g>`;
}

/* ==========================================================================
   AUTO-LAYOUT ENGINE
   Give it relationships only; it works out where everything goes.
     spec = { edges:[{f,t,l,tech}],
              boundary?:{id, contains:[ids], href, tip},
              nodes?:[id | {id, pin:{col,row}, ext, hero}] }   // nodes optional
   Pipeline: semantic tiering → simulated-annealing on a grid (crossings,
   bends, node hits, boundary containment, compactness, aspect) → hub
   stretching (a node with neighbours on several rows grows tall so every
   edge to it is straight) → label-aware gap sizing → pixel geometry.
   ========================================================================== */
const NODE_SIZE = {person:[160,116], system:[200,116], external:[190,108], container:[190,112],
                   component:[200,112], database:[180,104], queue:[190,100]};
const LAYOUT_CACHE = new Map();

function prng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619); } return h >>> 0; }

const segHitsBox = (p, q, b) => Math.min(p[0],q[0]) < b.x+b.w && Math.max(p[0],q[0]) > b.x &&
                                Math.min(p[1],q[1]) < b.y+b.h && Math.max(p[1],q[1]) > b.y;

/* Orthogonal router shared by optimiser (grid units) and renderer (pixels):
   prefers a straight segment, then one bend (L), then two (Z), avoiding boxes. */
function orthoRoute(a, b, boxes, thr){
  const ov = (a1,a2,b1,b2) => Math.min(a2,b2) - Math.max(a1,b1);
  const acx = a.x+a.w/2, acy = a.y+a.h/2, bcx = b.x+b.w/2, bcy = b.y+b.h/2;
  const C = [];
  const yo = ov(a.y,a.y+a.h,b.y,b.y+b.h), xo = ov(a.x,a.x+a.w,b.x,b.x+b.w);
  if (yo > thr && xo <= 0){
    const lo = Math.max(a.y,b.y), hi = Math.min(a.y+a.h,b.y+b.h);
    const y = clamp(a.h <= b.h ? acy : bcy, lo + thr, hi - thr), lr = acx < bcx;
    C.push([[lr?a.x+a.w:a.x, y],[lr?b.x:b.x+b.w, y]]);
  }
  if (xo > thr && yo <= 0){
    const lo = Math.max(a.x,b.x), hi = Math.min(a.x+a.w,b.x+b.w);
    const x = clamp(a.w <= b.w ? acx : bcx, lo + thr, hi - thr), tb = acy < bcy;
    C.push([[x, tb?a.y+a.h:a.y],[x, tb?b.y:b.y+b.h]]);
  }
  // fast path: an unobstructed straight line can't be beaten
  if (C.length){
    const pts = C[0]; let clear = true;
    for (const bx of boxes){ if (bx !== a && bx !== b && segHitsBox(pts[0], pts[1], bx)){ clear = false; break; } }
    if (clear) return {pts, hits:0, bends:0, score:2};
  }
  if ((bcx < a.x || bcx > a.x+a.w) && (acy < b.y || acy > b.y+b.h))
    C.push([[bcx>acx?a.x+a.w:a.x, acy],[bcx, acy],[bcx, bcy>acy?b.y:b.y+b.h]]);
  if ((acx < b.x || acx > b.x+b.w) && (bcy < a.y || bcy > a.y+a.h))
    C.push([[acx, bcy>acy?a.y+a.h:a.y],[acx, bcy],[bcx>acx?b.x:b.x+b.w, bcy]]);
  if (a.x+a.w < b.x || b.x+b.w < a.x){
    const lr = acx < bcx, x1 = lr?a.x+a.w:a.x, x2 = lr?b.x:b.x+b.w, mx = (x1+x2)/2;
    C.push([[x1,acy],[mx,acy],[mx,bcy],[x2,bcy]]);
  }
  if (a.y+a.h < b.y || b.y+b.h < a.y){
    const tb = acy < bcy, y1 = tb?a.y+a.h:a.y, y2 = tb?b.y:b.y+b.h, my = (y1+y2)/2;
    C.push([[acx,y1],[acx,my],[bcx,my],[bcx,y2]]);
  }
  if (!C.length) C.push([[acx,acy],[bcx,bcy]]);
  let best = null;
  for (const pts of C){
    let hits = 0;
    for (const bx of boxes){
      if (bx === a || bx === b) continue;
      for (let i=1;i<pts.length;i++) if (segHitsBox(pts[i-1], pts[i], bx)){ hits++; break; }
    }
    const score = hits*100 + pts.length;
    if (!best || score < best.score) best = {pts, hits, bends:pts.length-2, score};
  }
  return best;
}

/* Relative placement constraints.
   above / below      same column, wholly above / below the other element
   leftOf / rightOf   overlapping rows, wholly left / right of the other element
   alignRow / alignCol  share a row / a column (either side)
   near               in an adjacent cell (including diagonals)
   higherThan / lowerThan  anywhere higher / lower, any column
   Strict (default) constraints carry a heavy penalty and are reported if unmet;
   strict:false makes them a preference worth about one bend. */
const KIND_GRAVITY = 2;   // per grid cell between same-kind elements; below a soft user rule (4), above nothing structural: bends 3.2, crossings 14, lines through boxes 90
const LAYOUT_RELATIONS = ['above','below','leftOf','rightOf','alignRow','alignCol','near','higherThan','lowerThan'];
/* Placement inside the diagram's boundary (b = the boundary's id; the element must be inside it). */
const BOUNDARY_RELATIONS = ['atTopEdge','atBottomEdge','atLeftEdge','atRightEdge','atTopLeft','atTopRight','atBottomLeft','atBottomRight'];
const ALL_RELATIONS = [...LAYOUT_RELATIONS, ...BOUNDARY_RELATIONS];
const isBoundaryRel = rel => BOUNDARY_RELATIONS.includes(rel);

// How far a placement is from satisfying a constraint (0 = satisfied). Ranges include stretching.
function constraintGap(c, c0, c1, r0, r1, bb){
  const {i, j} = c;
  if (c.bnd){
    if (!bb) return 0;
    const top = r0[i]-bb.r0, bottom = bb.r1-r1[i], left = c0[i]-bb.c0, right = bb.c1-c1[i];
    switch (c.rel){
      case 'atTopEdge': return top;              case 'atBottomEdge': return bottom;
      case 'atLeftEdge': return left;            case 'atRightEdge': return right;
      case 'atTopLeft': return top + left;       case 'atTopRight': return top + right;
      case 'atBottomLeft': return bottom + left; case 'atBottomRight': return bottom + right;
    }
    return 0;
  }
  // an outside element placed relative to the boundary measures against the boundary's box
  let jr0, jr1, jc0, jc1;
  if (c.bref){ if (!bb) return 0; jr0 = bb.r0; jr1 = bb.r1; jc0 = bb.c0; jc1 = bb.c1; }
  else { jr0 = r0[j]; jr1 = r1[j]; jc0 = c0[j]; jc1 = c1[j]; }
  const ir0 = r0[i], ir1 = r1[i], ic0 = c0[i], ic1 = c1[i];
  const rov = Math.min(ir1, jr1) - Math.max(ir0, jr0), rowGap = rov >= 0 ? 0 : -rov;
  const cov = Math.min(ic1, jc1) - Math.max(ic0, jc0), colGap = cov >= 0 ? 0 : -cov;
  switch (c.rel){
    case 'above':      return colGap + Math.max(0, ir1 - jr0 + 1);
    case 'below':      return colGap + Math.max(0, jr1 - ir0 + 1);
    case 'leftOf':     return rowGap + Math.max(0, ic1 - jc0 + 1);
    case 'rightOf':    return rowGap + Math.max(0, jc1 - ic0 + 1);
    case 'alignRow':   return rowGap;
    case 'alignCol':   return colGap;
    case 'near':       return Math.max(0, Math.max(colGap, rowGap) - 1);
    case 'higherThan': return Math.max(0, ir1 - jr0 + 1);
    case 'lowerThan':  return Math.max(0, jr1 - ir0 + 1);
  }
  return 0;
}
// The cell that would satisfy a constraint for element i, given where j currently is.
function constraintTarget(c, st, G){
  if (c.bref){
    let minC = 99, maxC = -1, minR = 99, maxR = -1;
    for (let k=0;k<G.N;k++) if (G.isIn[k]){ const cc = st[2*k], rr = st[2*k+1]; minC = Math.min(minC,cc); maxC = Math.max(maxC,cc); minR = Math.min(minR,rr); maxR = Math.max(maxR,rr); }
    const ci = st[2*c.i], ri = st[2*c.i+1];
    if (maxC < 0) return [ci, ri];
    const cc = clamp(ci, minC, maxC), rr = clamp(ri, minR, maxR);
    switch (c.rel){
      case 'above':      return [cc, minR-1];
      case 'below':      return [cc, maxR+1];
      case 'leftOf':     return [minC-1, rr];
      case 'rightOf':    return [maxC+1, rr];
      case 'alignRow':   return [ci, rr];
      case 'alignCol':   return [cc, ri];
      case 'near':       return [maxC+1, rr];
      case 'higherThan': return [ci, Math.min(ri, minR-1)];
      case 'lowerThan':  return [ci, Math.max(ri, maxR+1)];
    }
    return [ci, ri];
  }
  if (c.bnd){
    let minC = 99, maxC = -1, minR = 99, maxR = -1;
    for (let k=0;k<G.N;k++) if (G.isIn[k] && k !== c.i){ const cc = st[2*k], rr = st[2*k+1]; minC = Math.min(minC,cc); maxC = Math.max(maxC,cc); minR = Math.min(minR,rr); maxR = Math.max(maxR,rr); }
    const ci = st[2*c.i], ri = st[2*c.i+1];
    if (maxC < 0) return [ci, ri];
    const T = {atTopEdge:[ci,minR], atBottomEdge:[ci,maxR], atLeftEdge:[minC,ri], atRightEdge:[maxC,ri],
               atTopLeft:[minC,minR], atTopRight:[maxC,minR], atBottomLeft:[minC,maxR], atBottomRight:[maxC,maxR]};
    return T[c.rel] || [ci, ri];
  }
  const ci = st[2*c.i], ri = st[2*c.i+1], cj = st[2*c.j], rj = st[2*c.j+1];
  switch (c.rel){
    case 'above':      return [cj, rj-1];
    case 'below':      return [cj, rj+1];
    case 'leftOf':     return [cj-1, rj];
    case 'rightOf':    return [cj+1, rj];
    case 'alignRow':   return [ci, rj];
    case 'alignCol':   return [cj, ri];
    case 'near':       return [cj+1, rj];
    case 'higherThan': return [ci, Math.min(ri, rj-1)];
    case 'lowerThan':  return [ci, Math.max(ri, rj+1)];
  }
  return [ci, ri];
}

function prepareGraph(spec){
  const ids = [], seen = new Set(), meta = {};
  const add = (id, m) => { if (!EL[id]) throw new Error('Unknown element: '+id); if (!seen.has(id)){ seen.add(id); ids.push(id); meta[id] = {}; } if (m) Object.assign(meta[id], m); };
  (spec.nodes||[]).forEach(n => typeof n === 'string' ? add(n) : add(n.id, n));
  (spec.boundary?.contains||[]).forEach(id => add(id));
  spec.edges.forEach(e => { add(e.f); add(e.t); });
  const inside = new Set(spec.boundary?.contains||[]);
  const ix = {}; ids.forEach((id,i) => ix[id] = i);
  const N = ids.length;
  const E = spec.edges.map(e => ({f:ix[e.f], t:ix[e.t]}));
  const nbr = ids.map(() => []);
  E.forEach(e => { if (!nbr[e.f].includes(e.t)) nbr[e.f].push(e.t); if (!nbr[e.t].includes(e.f)) nbr[e.t].push(e.f); });
  const kind = ids.map(id => EL[id].kind);
  const isIn = ids.map(id => inside.has(id));
  const hubOrder = ids.map((_,i)=>i).filter(i => nbr[i].length >= 2).sort((a,b) => nbr[b].length - nbr[a].length);
  // relative constraints: on node hints ({id, above:'x'}) or spec.constraints ([{a, rel, b, strict}])
  const cons = [];
  const addCon = (a, rel, b, strict, where) => {
    if (!ALL_RELATIONS.includes(rel)) throw new Error(`Unknown layout constraint "${rel}" in ${where}. Use one of: ${ALL_RELATIONS.join(', ')}`);
    if (isBoundaryRel(rel)){
      if (!spec.boundary || b !== spec.boundary.id) throw new Error(`Layout constraint "${a} ${rel} ${b}": "${rel}" places an element inside this diagram's boundary, so "${b}" must be the boundary (${spec.boundary ? spec.boundary.id : 'this diagram has none'})`);
      if (!inside.has(a)) throw new Error(`Layout constraint "${a} ${rel} ${b}": "${a}" is not inside the ${b} boundary`);
      cons.push({i:ix[a], j:-1, a, b, rel, bnd:true, strict: strict !== false, w: strict === false ? 4 : 60});
      return;
    }
    if (spec.boundary && b === spec.boundary.id){
      if (!(a in ix)) throw new Error(`Layout constraint "${a} ${rel} ${b}" refers to "${a}", which is not in this diagram`);
      if (inside.has(a)) throw new Error(`Layout constraint "${a} ${rel} ${b}": "${a}" is inside the ${b} boundary, so place it with ${BOUNDARY_RELATIONS.join(', ')}`);
      cons.push({i:ix[a], j:-1, a, b, rel, bref:true, strict: strict !== false, w: strict === false ? 4 : 60});
      return;
    }
    for (const id of [a, b]) if (!(id in ix)) throw new Error(`Layout constraint "${a} ${rel} ${b}" refers to "${id}", which is not in this diagram`);
    if (a === b) throw new Error(`Layout constraint "${a} ${rel} ${b}" refers to the same element twice`);
    cons.push({i:ix[a], j:ix[b], a, b, rel, strict: strict !== false, w: strict === false ? 4 : 60});
  };
  (spec.nodes||[]).forEach(n => { if (typeof n === 'object') ALL_RELATIONS.forEach(rel => {
    if (n[rel] != null) [].concat(n[rel]).forEach(b => addCon(n.id, rel, b, n.strict, `node "${n.id}"`)); }); });
  (spec.constraints||[]).forEach((c,k) => addCon(c.a, c.rel, c.b, c.strict, `constraints[${k}]`));
  // same-kind gravity: groups of 2+ elements of one kind (inside vs outside the boundary kept apart)
  const kindGroups = spec.groupByKind === false ? [] : Object.values(ids.reduce((g, id, i) => {
    const k = kind[i] + (isIn[i] ? '|in' : '|out'); (g[k] = g[k] || []).push(i); return g; }, {})).filter(g => g.length > 1);
  return {ids, meta, N, E, nbr, kind, isIn, hasB: inside.size > 0, hubOrder, cons, kindGroups};
}

/* Semantic tiering: longest-path rank from the actors, rows by barycentre. */
function initialState(G, C, R){
  const {N, E, kind} = G;
  const rank = new Array(N).fill(0);
  for (let pass=0; pass<N; pass++){
    let changed = false;
    for (const e of E){ if (kind[e.t] === 'person') continue; if (rank[e.f]+1 > rank[e.t] && rank[e.f]+1 < N){ rank[e.t] = rank[e.f]+1; changed = true; } }
    if (!changed) break;
  }
  const maxR = Math.max(...rank);
  const st = new Int16Array(2*N);
  const rowOf = new Array(N).fill(0);
  for (let r=0; r<=maxR; r++){
    const tier = []; for (let i=0;i<N;i++) if (rank[i] === r) tier.push(i);
    const bary = i => { const ps = G.nbr[i].filter(j => rank[j] < r); return ps.length ? ps.reduce((s,j)=>s+rowOf[j],0)/ps.length : 0; };
    tier.sort((a,b) => bary(a) - bary(b));
    tier.forEach((i,k) => { rowOf[i] = k; st[2*i] = Math.min(r+1, C-1); st[2*i+1] = Math.min(k+1, R-1); });
  }
  // resolve accidental collisions from clamping
  const used = new Set();
  for (let i=0;i<N;i++){
    let c = st[2*i], r = st[2*i+1];
    while (used.has(c*R+r)){ r++; if (r >= R){ r = 0; c = (c+1) % C; } }
    used.add(c*R+r); st[2*i] = c; st[2*i+1] = r;
  }
  return st;
}

/* Evaluate a grid placement. Returns a scalar cost (lower is better). */
function boundaryBox(G, c0, c1, r0, r1){
  const bb = {c0:99, c1:-99, r0:99, r1:-99};
  for (let i=0;i<G.N;i++) if (G.isIn[i]){ bb.c0 = Math.min(bb.c0,c0[i]); bb.c1 = Math.max(bb.c1,c1[i]); bb.r0 = Math.min(bb.r0,r0[i]); bb.r1 = Math.max(bb.r1,r1[i]); }
  return bb;
}
function makeEvaluator(G, C, R){
  const {N, E, nbr, kind, isIn, hasB, hubOrder} = G;
  const occ = new Int16Array(C*R), sp = new Uint8Array(C*R);
  const r0 = new Int16Array(N), r1 = new Int16Array(N), c0 = new Int16Array(N), c1 = new Int16Array(N);
  const boxes = Array.from({length:N}, () => ({x:0,y:0,w:0,h:0}));
  const HW = .32, HH = .28;
  const free = (c, r) => !occ[c*R+r] && !sp[c*R+r];
  /* Hub stretching, in both directions:
     1. grow taller to meet neighbours beside it (in other columns)
     2. grow wider to meet neighbours above / below it that are still out of reach
     Each only as far as needed, and only into empty cells. */
  function spans(st){
    occ.fill(0); sp.fill(0);
    for (let i=0;i<N;i++){ occ[st[2*i]*R + st[2*i+1]] = i+1; r0[i] = r1[i] = st[2*i+1]; c0[i] = c1[i] = st[2*i]; }
    for (const i of hubOrder){
      const c = st[2*i], row = st[2*i+1];
      // 1. taller: walk up / down independently through free cells, stopping at the furthest
      //    row that actually meets a side neighbour (so a blocked direction doesn't cancel the other)
      const up = new Set(), down = new Set();
      for (const j of nbr[i]) if (c1[j] < c || c0[j] > c){ if (r1[j] < row) up.add(r1[j]); else if (r0[j] > row) down.add(r0[j]); }
      let lo = row, hi = row;
      for (let r=row-1; r>=0 && up.size; r--){ if (!free(c, r)) break; if (up.has(r)) lo = r; }
      for (let r=row+1; r<R && down.size; r++){ if (!free(c, r)) break; if (down.has(r)) hi = r; }
      if (lo < row || hi > row){ for (let r=lo; r<=hi; r++) sp[c*R+r] = 1; r0[i] = lo; r1[i] = hi; }
      // 2. wider: same idea for neighbours above / below that are still out of reach
      const left = new Set(), right = new Set();
      for (const j of nbr[i]) if (r1[j] < r0[i] || r0[j] > r1[i]){ if (c1[j] < c) left.add(c1[j]); else if (c0[j] > c) right.add(c0[j]); }
      const colFree = cc => { for (let r=r0[i]; r<=r1[i]; r++) if (!free(cc, r)) return false; return true; };
      let cl = c, ch = c;
      for (let cc=c-1; cc>=0 && left.size; cc--){ if (!colFree(cc)) break; if (left.has(cc)) cl = cc; }
      for (let cc=c+1; cc<C && right.size; cc++){ if (!colFree(cc)) break; if (right.has(cc)) ch = cc; }
      if (cl < c || ch > c){ for (let cc=cl; cc<=ch; cc++) for (let r=r0[i]; r<=r1[i]; r++) sp[cc*R+r] = 1; c0[i] = cl; c1[i] = ch; }
    }
    for (let i=0;i<N;i++){ const b = boxes[i]; b.x = c0[i]-HW; b.w = c1[i]-c0[i]+2*HW; b.y = r0[i]-HH; b.h = r1[i]-r0[i]+2*HH; }

    spans(st);
    let cost = 0;
    for (let i=0;i<N;i++) cost += (r1[i]-r0[i] + c1[i]-c0[i]) * .6;   // stretch only when it buys straight edges
    const segs = [];
    for (let k=0;k<E.length;k++){
      const e = E[k], a = boxes[e.f], b = boxes[e.t];
      const r = orthoRoute(a, b, boxes, .05);
      cost += r.hits*90 + r.bends*3.2;
      for (let i=1;i<r.pts.length;i++){
        const p = r.pts[i-1], q = r.pts[i];
        cost += (Math.abs(p[0]-q[0]) + Math.abs(p[1]-q[1])) * .35;
        segs.push(p[0], p[1], q[0], q[1], e.f, e.t);
      }
      if (b.x + b.w/2 < a.x + a.w/2 - .5) cost += .5;           // prefer left → right
      else if (Math.abs(a.x-b.x) < .5 && b.y < a.y) cost += .25;  // and top → bottom
    }
    // crossings & overlaps — including lines that leave the same element on top of each other
    const S = segs.length/6;
    for (let i=0;i<S;i++) for (let j=i+1;j<S;j++){
      const a = i*6, b = j*6;
      const af = segs[a+4], at = segs[a+5], bf = segs[b+4], bt = segs[b+5];
      if ((af===bf && at===bt) || (af===bt && at===bf)) continue;   // parallel edges are offset when drawn
      const ax1=segs[a],ay1=segs[a+1],ax2=segs[a+2],ay2=segs[a+3], bx1=segs[b],by1=segs[b+1],bx2=segs[b+2],by2=segs[b+3];
      const aH = Math.abs(ay1-ay2) < 1e-6, bH = Math.abs(by1-by2) < 1e-6;
      if (aH !== bH){
        const [hx1,hx2,hy, vx,vy1,vy2] = aH ? [ax1,ax2,ay1, bx1,by1,by2] : [bx1,bx2,by1, ax1,ay1,ay2];
        if (vx > Math.min(hx1,hx2)+1e-3 && vx < Math.max(hx1,hx2)-1e-3 && hy > Math.min(vy1,vy2)+1e-3 && hy < Math.max(vy1,vy2)-1e-3) cost += 14;
      } else if (aH && Math.abs(ay1-by1) < .05){
        if (Math.min(Math.max(ax1,ax2),Math.max(bx1,bx2)) - Math.max(Math.min(ax1,ax2),Math.min(bx1,bx2)) > .01) cost += 14;
      } else if (!aH && Math.abs(ax1-bx1) < .05){
        if (Math.min(Math.max(ay1,ay2),Math.max(by1,by2)) - Math.max(Math.min(ay1,ay2),Math.min(by1,by2)) > .01) cost += 14;
      }

    for (let i=0;i<N;i++){ if (c0[i] < minC) minC = c0[i]; if (c1[i] > maxC) maxC = c1[i]; if (r0[i] < minR) minR = r0[i]; if (r1[i] > maxR) maxR = r1[i]; }

    const bb = hasB ? boundaryBox(G, c0, c1, r0, r1) : null;
    if (bb) for (let i=0;i<N;i++) if (!isIn[i] && c1[i] >= bb.c0 && c0[i] <= bb.c1 && r1[i] >= bb.r0 && r0[i] <= bb.r1) cost += 80;
    // relative constraints
    for (const c of G.cons) cost += c.w * constraintGap(c, c0, c1, r0, r1, bb);
    // same-kind gravity: a gentle pull (below soft rules, bends and crossings) towards elements of the same kind
    for (const g of G.kindGroups){
      let sum = 0;
      for (let a=0;a<g.length;a++) for (let b=a+1;b<g.length;b++){
        const i = g[a], j = g[b];
        const cg = Math.max(0, Math.max(c0[i], c0[j]) - Math.min(c1[i], c1[j])), rg = Math.max(0, Math.max(r0[i], r0[j]) - Math.min(r1[i], r1[j]));
        sum += Math.max(0, Math.max(cg, rg) - 1) + (cg && rg ? .5 : 0);
      }
      cost += KIND_GRAVITY * sum / (g.length - 1);
    }
    // actors belong on the outside edge
    for (let i=0;i<N;i++) if (kind[i] === 'person') cost += (c0[i] - minC) * 1.2;
    // compact, roughly 16:9
    const cols = new Set(), rows = new Set();
    for (let i=0;i<N;i++){ for (let c=c0[i]; c<=c1[i]; c++) cols.add(c); for (let r=r0[i]; r<=r1[i]; r++) rows.add(r); }
    const uc = cols.size, ur = rows.size;
    cost += uc*ur*.3 + (maxC-minC+1-uc)*1.5 + (maxR-minR+1-ur)*1.5;
    cost += 4*Math.abs(Math.log((uc*290)/(ur*175)/1.7));
    return cost;
  }
  return {cost, spans, r0, r1, c0, c1};
}

function anneal(G, C, R, seed, iters){
  const rand = prng(seed);
  const ev = makeEvaluator(G, C, R);
  const {N} = G;
  const pinned = G.ids.map(id => !!G.meta[id].pin);
  const st = initialState(G, C, R);
  G.ids.forEach((id,i) => { const p = G.meta[id].pin; if (p){ st[2*i] = p.col; st[2*i+1] = p.row; } });
  const at = (c,r) => { for (let j=0;j<N;j++) if (st[2*j]===c && st[2*j+1]===r) return j; return -1; };
  // place i into (c,r), swapping with any occupant; false if not allowed
  const put = (i, c, r) => {
    if (pinned[i] || c < 0 || r < 0 || c >= C || r >= R) return false;
    const j = at(c, r);
    if (j === i) return false;
    if (j >= 0){ if (pinned[j]) return false; st[2*j] = st[2*i]; st[2*j+1] = st[2*i+1]; }
    st[2*i] = c; st[2*i+1] = r; return true;
  };
  // give constrained elements a head start
  for (let pass=0; pass<2; pass++) for (const c of G.cons){ const [tc, tr] = constraintTarget(c, st, G); put(c.i, tc, tr); }
  let cur = ev.cost(st), best = cur, bestSt = st.slice();
  const save = new Int16Array(2*N);
  const T0 = 6, T1 = .02;
  for (let k=0;k<iters;k++){
    const T = T0 * Math.pow(T1/T0, k/iters);
    save.set(st);
    // occasionally jump a constrained element straight to the cell its constraint asks for
    if (G.cons.length && rand() < .12){
      const c = G.cons[rand()*G.cons.length|0];
      const [tc, tr] = constraintTarget(c, st, G);
      if (!put(c.i, tc, tr)) continue;
      const nc = ev.cost(st);
      if (nc <= cur || rand() < Math.exp((cur-nc)/T)){ cur = nc; if (nc < best){ best = nc; bestSt = st.slice(); } }
      else st.set(save);
      continue;
    }
    const i = rand()*N|0; if (pinned[i]) continue;
    const m = rand();
    let c, r;
    if (m < .6){ c = st[2*i] + Math.round((rand()-.5)*4); r = st[2*i+1] + Math.round((rand()-.5)*4); }
    else if (m < .8){ c = rand()*C|0; r = rand()*R|0; }
    else { const j = rand()*N|0; c = st[2*j]; r = st[2*j+1]; }
    if (c < 0 || r < 0 || c >= C || r >= R) continue;
    const j = at(c, r);
    if (j === i) continue;
    if (j >= 0){ if (pinned[j]) continue; st[2*j] = st[2*i]; st[2*j+1] = st[2*i+1]; }
    st[2*i] = c; st[2*i+1] = r;
    const nc = ev.cost(st);
    if (nc <= cur || rand() < Math.exp((cur-nc)/T)){ cur = nc; if (nc < best){ best = nc; bestSt = st.slice(); } }
    else st.set(save);
  }
  return {st:bestSt, cost:best};
}

/* Full pipeline: relationships in, pixel geometry out. */
function layoutDiagram(spec){
  if (spec.nodes && spec.nodes.length && spec.nodes.every(n => typeof n === 'object' && n.x != null)) return spec; // manual override
  const pillInfo = spec._key ? [...spec._ids].map(id => [id, pillsFor(id, spec._key).map(p => p.title)]).filter(x => x[1].length) : [];
  const key = JSON.stringify([spec.edges, spec.boundary, spec.nodes, spec.constraints, pillInfo, spec.groupByKind !== false]);
  if (LAYOUT_CACHE.has(key)) return LAYOUT_CACHE.get(key);
  const pkey = 'arc-layout-v9-' + hashStr(key).toString(36);
  try { const hit = JSON.parse(localStorage.getItem(pkey)); if (hit){ const out = {...spec, ...hit}; LAYOUT_CACHE.set(key, out); return out; } } catch(e){}
  const t0 = performance.now();
  const G = prepareGraph(spec);
  const {N, ids} = G;
  const C = Math.min(N+2, 12), R = Math.min(N+2, 10);
  const iters = Math.round(3000 + N*N*55);
  let best = null;
  const seed = hashStr(key);
  const restarts = N > 10 ? 5 : 3;
  for (let k=0;k<restarts;k++){ const r = anneal(G, C, R, seed + k*7919, iters); if (!best || r.cost < best.cost) best = r; }
  const ev = makeEvaluator(G, C, R); ev.spans(best.st);
  const fbb = G.hasB ? boundaryBox(G, ev.c0, ev.c1, ev.r0, ev.r1) : null;
  const violations = G.cons.filter(c => constraintGap(c, ev.c0, ev.c1, ev.r0, ev.r1, fbb) > 0)
    .map(c => `${c.a} ${c.rel} ${c.b}${c.strict ? '' : ' (soft)'}`);
  const strictMisses = violations.filter(v => !v.endsWith('(soft)'));
  if (strictMisses.length) console.warn(`[layout] "${spec.title||''} ${spec.sub||''}": could not satisfy ${strictMisses.join('; ')}. Check for contradictory constraints.`);
  // compress unused columns / rows
  const st = best.st, cUsed = new Set(), rUsed = new Set();
  for (let i=0;i<N;i++){ for (let c=ev.c0[i]; c<=ev.c1[i]; c++) cUsed.add(c); for (let r=ev.r0[i]; r<=ev.r1[i]; r++) rUsed.add(r); }
  const cMap = new Map([...cUsed].sort((a,b)=>a-b).map((c,i)=>[c,i])), rMap = new Map([...rUsed].sort((a,b)=>a-b).map((r,i)=>[r,i]));
  const nodes = ids.map((id,i) => {
    const k = EL[id].kind, m = G.meta[id];
    const ext = m.ext ?? (G.hasB && !G.isIn[i] && !['person','external'].includes(k));
    const hero = m.hero ?? (k === 'system' && !G.hasB);
    let [w,h] = NODE_SIZE[k]; if (hero){ w = 300; h = 150; }
    const pills = spec._key ? pillsFor(id, spec._key) : [];
    if (pills.length){ w = Math.max(w, pillRowWidth(pills) + 2*PILL.pad); h += PILL.h + 14; }
    return {id, w, h, ext, hero, col:cMap.get(ev.c0[i]), col1:cMap.get(ev.c1[i]), row:rMap.get(ev.r0[i]), row1:rMap.get(ev.r1[i])};
  });
  const nC = cMap.size, nR = rMap.size;
  const NI = {}; nodes.forEach(n => NI[n.id] = n);

  // grid-space routes tell us which gaps carry labels
  const gb = nodes.map(n => ({x:n.col-.32, y:n.row-.28, w:n.col1-n.col+.64, h:n.row1-n.row+.56}));
  const gapX = new Array(nC).fill(70), gapY = new Array(nR).fill(46);
  const lblW = e => Math.max(e.l.length*6.4, (e.tech||'').length*6.2) + 18;
  const pairKey = e => [e.f,e.t].sort().join('|');
  const groups = {}; spec.edges.forEach(e => (groups[pairKey(e)] = groups[pairKey(e)] || []).push(e));
  spec.edges.forEach(e => {
    const grp = groups[pairKey(e)];
    const a = NI[e.f], b = NI[e.t], r = orthoRoute(gb[ids.indexOf(e.f)], gb[ids.indexOf(e.t)], gb, .05);
    // the label sits on the longest segment; size the gap(s) that segment lies in
    let L = 0, s = null;
    for (let i=1;i<r.pts.length;i++){ const d = Math.abs(r.pts[i][0]-r.pts[i-1][0]) + Math.abs(r.pts[i][1]-r.pts[i-1][1]); if (d > L){ L = d; s = [r.pts[i-1], r.pts[i]]; } }
    if (!s) return;
    if (Math.abs(s[0][1]-s[1][1]) < 1e-6){ const c = Math.floor((s[0][0]+s[1][0])/2); if (c >= 0 && c < nC-1 && Math.abs(s[0][0]-s[1][0]) < 1.01) gapX[c] = Math.max(gapX[c], grp.reduce((t,g)=>t+lblW(g)+8,0)+18); }
    else { const rr = Math.floor((s[0][1]+s[1][1])/2); if (rr >= 0 && rr < nR-1 && Math.abs(s[0][1]-s[1][1]) < 1.01) gapY[rr] = Math.max(gapY[rr], grp.reduce((t,g)=>t+(g.tech?34:22)+8,0)+22); }
  });
  // room for the boundary frame & its label
  let bb = null;
  if (G.hasB){
    const ins = nodes.filter((n,i) => G.isIn[i]);
    bb = {c0:Math.min(...ins.map(n=>n.col)), c1:Math.max(...ins.map(n=>n.col1)), r0:Math.min(...ins.map(n=>n.row)), r1:Math.max(...ins.map(n=>n.row1))};
    if (bb.c0 > 0) gapX[bb.c0-1] = Math.max(gapX[bb.c0-1], 110);
    if (bb.c1 < nC-1) gapX[bb.c1] = Math.max(gapX[bb.c1], 110);
    if (bb.r0 > 0) gapY[bb.r0-1] = Math.max(gapY[bb.r0-1], 92);
    if (bb.r1 < nR-1) gapY[bb.r1] = Math.max(gapY[bb.r1], 116);
  }
  // a person's head sits above its box: give the gap above it room
  nodes.forEach(n => { if (EL[n.id].kind === 'person' && n.row > 0) gapY[n.row-1] += 18; });
  // pixel tracks
  const colW = new Array(nC).fill(150), rowH = new Array(nR).fill(96);
  nodes.forEach(n => { if (n.col === n.col1) colW[n.col] = Math.max(colW[n.col], n.w); if (n.row === n.row1) rowH[n.row] = Math.max(rowH[n.row], n.h); });
  const M = 44, cx = [], cy = [];
  let x = M; for (let c=0;c<nC;c++){ cx[c] = x + colW[c]/2; x += colW[c] + gapX[c]; }
  let y = M + 18; for (let r=0;r<nR;r++){ cy[r] = y + rowH[r]/2; y += rowH[r] + gapY[r]; }
  nodes.forEach(n => {
    if (n.col === n.col1) n.x = cx[n.col] - n.w/2;
    else { n.x = cx[n.col] - colW[n.col]/2; n.w = cx[n.col1] + colW[n.col1]/2 - n.x; n.wide = true; }
    if (n.row === n.row1) n.y = cy[n.row] - n.h/2;
    else { n.y = cy[n.row] - rowH[n.row]/2; n.h = cy[n.row1] + rowH[n.row1]/2 - n.y; n.span = true; }
  });
  let boundary = null;
  if (bb){
    const ins = nodes.filter((n,i) => G.isIn[i]);
    const x0 = Math.min(...ins.map(n=>n.x)) - 40, x1 = Math.max(...ins.map(n=>n.x+n.w)) + 40;
    const y0 = Math.min(...ins.map(n=>n.y)) - (ins.some(n=>EL[n.id].kind==='person')?56:40), y1 = Math.max(...ins.map(n=>n.y+n.h)) + 66;
    boundary = {...spec.boundary, x:x0, y:y0, w:x1-x0, h:y1-y0};
  }
  const all = nodes.map(n => [n.x, n.y - (EL[n.id].kind==='person'?20:0), n.x+n.w, n.y+n.h]);
  if (boundary) all.push([boundary.x, boundary.y, boundary.x+boundary.w, boundary.y+boundary.h]);
  const vx0 = Math.min(...all.map(a=>a[0])) - 36, vy0 = Math.min(...all.map(a=>a[1])) - 30;
  const vx1 = Math.max(...all.map(a=>a[2])) + 36, vy1 = Math.max(...all.map(a=>a[3])) + 30;
  const out = {...spec, nodes, boundary, vb:[vx0, vy0, vx1-vx0, vy1-vy0], _ms: performance.now()-t0, _cost: best.cost, _violations: violations};
  LAYOUT_CACHE.set(key, out);
  try { localStorage.setItem(pkey, JSON.stringify({nodes, boundary, vb:out.vb, _ms:out._ms, _cost:out._cost, _violations:violations})); } catch(e){}
  return out;
}

/* Rounded orthogonal polyline. */
function polyPath(pts, rad=10){
  if (pts.length < 3) return pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ');
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i=1;i<pts.length-1;i++){
    const [px,py] = pts[i-1], [x,y] = pts[i], [nx,ny] = pts[i+1];
    const r = Math.min(rad, Math.hypot(x-px,y-py)/2, Math.hypot(nx-x,ny-y)/2);
    const ax = x - Math.sign(x-px)*r, ay = y - Math.sign(y-py)*r, bx = x + Math.sign(nx-x)*r, by = y + Math.sign(ny-y)*r;
    d += ` L${ax},${ay} Q${x},${y} ${bx},${by}`;
  }
  return d + ` L${pts[pts.length-1][0]},${pts[pts.length-1][1]}`;
}

/* When several lines meet a box at the same point, fan them out along that side. */
function spreadPorts(edges, routes, map, pairCount){
  const pk = e => [e.f,e.t].sort().join('|');
  const groups = {};
  routes.forEach((pts, k) => {
    const e = edges[k]; if (pairCount[pk(e)] > 1) return;            // parallel edges are offset separately
    [[e.f, 0, 1], [e.t, pts.length-1, pts.length-2]].forEach(([id, idx, nb]) => {
      const p = pts[idx], vertical = Math.abs(pts[nb][0] - p[0]) < .5;  // segment leaves top/bottom
      const key = `${id}|${Math.round(p[0])},${Math.round(p[1])}|${vertical}`;
      (groups[key] = groups[key] || []).push({k, idx, nb, vertical, id});
    });
  });
  for (const g of Object.values(groups)){
    if (g.length < 2) continue;
    const ax = g[0].vertical ? 0 : 1;                                   // axis to spread along
    const far = m => { const pts = routes[m.k]; return pts[m.idx === 0 ? pts.length-1 : 0][ax]; };
    g.sort((a,b) => far(a) - far(b));
    const box = map[g[0].id], span = ax === 0 ? box.w : box.h, step = Math.min(18, (span - 24) / Math.max(1, g.length-1));
    g.forEach((m, i) => {
      const off = (i - (g.length-1)/2) * step, pts = routes[m.k];
      if (pts.length >= 3){ pts[m.idx][ax] += off; pts[m.nb][ax] += off; }
      else {
        const other = map[edges[m.k][m.idx === 0 ? 't' : 'f']], v = pts[0][ax] + off;
        const inside = b => ax === 0 ? v > b.x + 8 && v < b.x + b.w - 8 : v > b.y + 8 && v < b.y + b.h - 8;
        if (inside(box) && inside(other)){ pts[0][ax] = v; pts[1][ax] = v; }
      }
    });
  }
}

/* Geometry for one edge: final polyline, label size, and the default label spot
   (middle of the longest segment; parallel edges spread their labels along it). */
function edgeGeom(e, pts, a, b, k=0, n=1){
  const shift = k - (n-1)/2;
  const horizLine = pts.length === 2 && pts[0][1] === pts[1][1];
  if (n > 1 && pts.length === 2){ const o = shift*14; if (horizLine){ pts[0][1] += o; pts[1][1] += o; } else { pts[0][0] += o; pts[1][0] += o; } }
  // persons have a head above the box
  const last = pts.length-1;
  if (EL[e.t].kind === 'person' && pts[last][1] === b.y) pts[last][1] -= 17;
  if (EL[e.f].kind === 'person' && pts[0][1] === a.y) pts[0][1] -= 17;
  let best = -1, si = 1;
  for (let i=1;i<pts.length;i++){ const L = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); if (L > best){ best = L; si = i; } }
  const p = pts[si-1], q = pts[si];
  const w = Math.max(e.l.length*6.4, (e.tech||'').length*6.2) + 18, h = e.tech ? 34 : 22;
  let mx = (p[0]+q[0])/2, my = (p[1]+q[1])/2;
  const horiz = Math.abs(p[1]-q[1]) < .5;
  if (n > 1){ if (horiz) mx += shift*(w+8); else my += shift*(h+8); }
  return {e, pts, w, h, mx, my, seg:[p, q], horiz, headSeg: si === pts.length-1};
}

/* Labels sit mid-line by default. Only a label that collides with another label, another
   line or a box is moved: it slides along its own segment towards the arrow head first,
   then towards the tail, and settles on the first clear spot (or the least crowded one). */
function placeLabels(geoms, nodes){
  const placed = [];
  const samePair = (x, y) => (x.e.f === y.e.f && x.e.t === y.e.t) || (x.e.f === y.e.t && x.e.t === y.e.f);   // parallel lines run under each other's labels by design
  const rectOf = (g, x, y) => ({x:x - g.w/2 - 3, y:y - g.h/2 - 3, w:g.w + 6, h:g.h + 6});
  const over = (r, o) => r.x < o.x + o.w && r.x + r.w > o.x && r.y < o.y + o.h && r.y + r.h > o.y;
  const clashes = (g, x, y) => {
    const r = rectOf(g, x, y); let n = 0;
    for (const o of placed) if (over(r, o)) n += 3;
    for (const nd of nodes) if (over(r, {x:nd.x, y:nd.y - (EL[nd.id].kind === 'person' ? 20 : 0), w:nd.w, h:nd.h + (EL[nd.id].kind === 'person' ? 20 : 0)})) n += 2;
    for (const o of geoms) if (o !== g && !samePair(o, g)) for (let i=1;i<o.pts.length;i++) if (segHitsBox(o.pts[i-1], o.pts[i], r)) n += 1;
    return n;
  };
  for (const g of geoms){
    let bx = g.mx, by = g.my, bestN = clashes(g, bx, by);
    if (bestN > 0){
      const [p, q] = g.seg, ax = g.horiz ? 0 : 1, half = (g.horiz ? g.w : g.h)/2;
      const dirQ = Math.sign(q[ax] - p[ax]) || 1;
      const start = ax === 0 ? g.mx : g.my;
      // room to slide: stop short of the arrow head (marker) and of the tail
      const headLimit = q[ax] - dirQ*(half + (g.headSeg ? 16 : 8)), tailLimit = p[ax] + dirQ*(half + 8);
      const tries = [];
      for (let v = start + dirQ*6; dirQ*(headLimit - v) >= 0; v += dirQ*6) tries.push(v);   // towards the arrow head
      for (let v = start - dirQ*6; dirQ*(v - tailLimit) >= 0; v -= dirQ*6) tries.push(v);   // then towards the tail
      for (const v of tries){
        const x = ax === 0 ? v : g.mx, y = ax === 1 ? v : g.my, n = clashes(g, x, y);
        if (n < bestN){ bestN = n; bx = x; by = y; if (!n) break; }
      }
    }
    g.moved = bx !== g.mx || by !== g.my; g.mx = bx; g.my = by;
    placed.push(rectOf(g, bx, by));
  }
}

function edgeSVG(g, uid){
  const {e, pts, w, h, mx, my} = g;
  return `<g class="edge" data-f="${e.f}" data-t="${e.t}">
    <path class="ln" d="${polyPath(pts)}" marker-end="url(#ar-${uid})"/>
    <g class="lbl"><rect x="${mx-w/2}" y="${my-h/2}" width="${w}" height="${h}" rx="7"/>
      <text class="t1" x="${mx}" y="${my+(e.tech?-2.5:4)}" text-anchor="middle">${esc(e.l)}</text>
      ${e.tech?`<text class="t2" x="${mx}" y="${my+11.5}" text-anchor="middle">${esc(e.tech)}</text>`:''}</g></g>`;
}

function c4SVG(raw, view, key=''){
  const spec = layoutDiagram(raw);
  const uid = ++UID;
  const map = {}; spec.nodes.forEach(n => map[n.id] = n);
  const boxes = spec.nodes;
  const ruled = new Set(specRules(key && DIAGRAMS[key] ? DIAGRAMS[key] : raw).map(r => r.a));
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${spec.vb.join(' ')}" preserveAspectRatio="xMidYMid meet" data-uid="${uid}" data-key="${key}">
   <defs>
     <marker id="ar-${uid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="arrow" d="M0,1 L9.5,5 L0,9 L2.2,5 z"/></marker>
     <marker id="arh-${uid}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path class="arrow-hl" d="M0,1 L9.5,5 L0,9 L2.2,5 z"/></marker>
   </defs>`;
  const pk = e => [e.f,e.t].sort().join('|'), cnt = {}, seen = {};
  spec.edges.forEach(e => cnt[pk(e)] = (cnt[pk(e)]||0) + 1);
  const routes = spec.edges.map(e => orthoRoute(map[e.f], map[e.t], boxes, 12).pts.map(p => p.slice()));
  spreadPorts(spec.edges, routes, map, cnt);
  if (spec.boundary){
    const b = spec.boundary, e = EL[b.id];
    const line2 = `[${KIND[e.kind].label}${e.tech ? ': ' + e.tech : ''}]`;
    const lw = Math.max(e.name.length * 7.6, line2.length * 6.4) + 12, lh = 38;
    // put the boundary's name in whichever corner no line passes through
    const corners = [
      {x:b.x+20, y:b.y+b.h-50, anchor:'start'}, {x:b.x+b.w-20-lw, y:b.y+b.h-50, anchor:'end'},
      {x:b.x+20, y:b.y+8, anchor:'start'},      {x:b.x+b.w-20-lw, y:b.y+8, anchor:'end'}];
    const clashes = c => {
      const box = {x:c.x-4, y:c.y-2, w:lw+8, h:lh+4};
      let n = 0;
      for (const pts of routes) for (let i=1;i<pts.length;i++) if (segHitsBox(pts[i-1], pts[i], box)) n++;
      for (const nd of spec.nodes) if (nd.x < box.x+box.w && nd.x+nd.w > box.x && nd.y-20 < box.y+box.h && nd.y+nd.h > box.y) n += 5;
      return n;
    };
    const spot = corners.reduce((best, c) => { const k = clashes(c); return k < best.k ? {c, k} : best; }, {c:corners[0], k:Infinity}).c;
    const tx = spot.anchor === 'start' ? spot.x : spot.x + lw;
    s += `<g class="boundary k-${e.kind}${b.href?' link':''}" ${b.href?`data-href="${b.href}" data-tip="${esc(b.tip)}"`:''}>
      <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="18"/>
      <text class="bn" x="${tx}" y="${spot.y+16}" text-anchor="${spot.anchor}">${esc(e.name)}</text>
      <text class="bt" x="${tx}" y="${spot.y+33}" text-anchor="${spot.anchor}">${esc(line2)}</text></g>`;
  }
  const geoms = spec.edges.map((e, i) => { const k = pk(e); seen[k] = (seen[k]||0) + 1; return edgeGeom(e, routes[i], map[e.f], map[e.t], seen[k]-1, cnt[k]); });
  placeLabels(geoms, spec.nodes);
  s += geoms.map(g => edgeSVG(g, uid)).join('');
  s += spec.nodes.map(n => nodeSVG(n, view, uid, ruled.has(n.id))).join('');
  return s + '</svg>';
}

function legendHTML(kinds, opts={}){
  let h = kinds.map(k => `<span class="lg"><i class="sw k-${k}"></i>${KIND[k].label}</span>`).join('');
  if (opts.ext) h += `<span class="lg"><i class="sw ext"></i>Outside scope</span>`;
  if (opts.seq) h += `<span class="lg"><i class="sw line"></i>Call</span><span class="lg"><i class="sw dash"></i>Return</span>`;
  h += `<span class="lg"><i class="sw clk"></i>Clickable</span>`;
  return h + `<span class="hint">Hover to trace · drag to pan · ⌘/Ctrl+scroll to zoom</span>`;
}

/* ==========================================================================
   SEQUENCE RENDERER
   ========================================================================== */
function seqSVG(spec, view){
  const uid = ++UID;
  const P = spec.p, n = P.length, W = 1240, padX = 100;
  const gap = (W - 2*padX)/(n-1), X = {};
  P.forEach((id,i)=> X[id] = padX + i*gap);
  const boxW = Math.min(gap - 22, 172), headY = 22, headH = 62;
  let y = headY + headH + 46;
  const msgs = [], frames = [], stack = [], notes = [], acts = [], open = {};
  let num = 0;
  const depth = id => (open[id]||[]).length;
  for (const s of spec.s){
    if (s.frame){ const f = {kind:s.frame,label:s.label,y0:y-16,parts:[],ids:new Set(),depth:stack.length}; stack.push(f); frames.push(f); y += 36; continue; }
    if (s.else !== undefined){ stack[stack.length-1].parts.push({y:y-14,label:s.else}); y += 36; continue; }
    if (s.end){ const f = stack.pop(); f.y1 = y - 12; y += 26; continue; }
    if (s.note){ notes.push({...s, y}); stack.forEach(f => s.note.forEach(id => f.ids.add(id))); y += 54; continue; }
    const type = s.k || 'sync';
    const m = {...s, y, n:++num, type, self: s.f === s.t};
    stack.forEach(f => { f.ids.add(s.f); f.ids.add(s.t); });
    m.fd = depth(s.f); m.td = depth(s.t);
    msgs.push(m);
    if (m.self){ y += 60; continue; }
    const act = s.a ?? (type === 'sync' ? 1 : 0);
    const deact = s.d ?? (type === 'ret' ? 1 : 0);
    if (deact && depth(s.f)){ const o = open[s.f].pop(); acts.push({id:s.f, y0:o.y0, y1:y, depth:open[s.f].length}); }
    if (act){ (open[s.t] = open[s.t] || []).push({y0:y}); m.activates = true; }
    y += 44;
  }
  for (const id in open) while (open[id].length){ const o = open[id].pop(); acts.push({id, y0:o.y0, y1:y-22, depth:open[id].length}); }
  const H = y + 26;

  let s = `<svg xmlns="http://www.w3.org/2000/svg" class="seq" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" data-uid="${uid}">
    <defs>
      <marker id="sf-${uid}" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="marrow" d="M0,1 L10,5 L0,9 z"/></marker>
      <marker id="so-${uid}" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="marrow-o" d="M1,1 L9.5,5 L1,9"/></marker>
      <marker id="sr-${uid}" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="marrow-r" d="M1,1 L9.5,5 L1,9"/></marker>
    </defs>`;

  // frames: body behind lifelines, labels on top (added after activations)
  let frameLabels = '';
  frames.forEach(f => {
    const idx = [...f.ids].map(id => P.indexOf(id));
    const inset = f.depth*12;
    const x0 = X[P[Math.min(...idx)]] - 78 + inset, x1 = X[P[Math.max(...idx)]] + 78 - inset;
    const tw = f.kind.length*8 + 22;
    s += `<g class="frame"><rect class="fb" x="${x0}" y="${f.y0}" width="${x1-x0}" height="${f.y1-f.y0}" rx="8"/>${f.parts.map(p => `<line class="fsep" x1="${x0}" x2="${x1}" y1="${p.y}" y2="${p.y}"/>`).join('')}</g>`;
    frameLabels += `<g class="frame">
      <path class="ftab" d="M${x0+8},${f.y0} H${x0+tw} V${f.y0+14} L${x0+tw-8},${f.y0+22} H${x0} V${f.y0+8} A8,8 0 0 1 ${x0+8},${f.y0} Z"/>
      <text class="fk" x="${x0+10}" y="${f.y0+15.5}">${f.kind}</text>
      <rect class="fgbg" x="${x0+tw+5}" y="${f.y0+4}" width="${f.label.length*7+20}" height="17" rx="4"/>
      <text class="fg" x="${x0+tw+10}" y="${f.y0+15.5}">[${esc(f.label)}]</text>
      ${f.parts.map(p => `<rect class="fgbg" x="${x0+7}" y="${p.y+4}" width="${p.label.length*7+20}" height="17" rx="4"/><text class="fg" x="${x0+12}" y="${p.y+16}">[${esc(p.label)}]</text>`).join('')}</g>`;
  });

  // lifelines + activations
  P.forEach(id => { s += `<line class="lifeline" x1="${X[id]}" x2="${X[id]}" y1="${headY+headH}" y2="${H-14}"/>`; });
  acts.sort((a,b)=>a.depth-b.depth).forEach(a => {
    s += `<rect class="act k-${EL[a.id].kind}" x="${X[a.id]-6+a.depth*6}" y="${a.y0-3}" width="12" height="${a.y1-a.y0+6}" rx="2.5"/>`;
  });

  s += frameLabels;
  // participant heads
  P.forEach(id => {
    const e = EL[id], x = X[id] - boxW/2, lk = linkFor(id, view);
    const tag = e.tag || KIND[e.kind].label;
    const tagW = tag.length*6.3 + 14;
    let head = '';
    s += `<g class="node k-${e.kind}${lk?' link':''}" data-id="${id}"${lk?` data-href="${lk.href}" data-tip="${esc(lk.tip)}" data-sub="${esc(lk.sub)}"`:''}>
      <rect class="shape" x="${x}" y="${headY}" width="${boxW}" height="${headH}" rx="11"/>
      <rect class="tagbg" x="${X[id]-tagW/2}" y="${headY+11}" width="${tagW}" height="17" rx="8.5"/>
      <text class="tag" x="${X[id]}" y="${headY+23.2}" text-anchor="middle" style="font-size:9px">${esc(tag)}</text>
      <text class="nm" x="${X[id]}" y="${headY+47}" text-anchor="middle" style="font-size:13.5px">${esc(e.name)}</text>
      ${lk?`<g class="lk" transform="translate(${x+boxW-12},${headY+12})"><circle r="6.5"/><path d="M-2,2 L2,-2 M-0.8,-2 H2 V0.8" style="stroke-width:1.3"/></g>`:''}</g>`;
  });

  // notes
  notes.forEach(nt => {
    const xs = nt.note.map(id => X[id]);
    const x0 = Math.min(...xs) - 70, x1 = Math.max(...xs) + 70;
    s += `<g class="note"><rect x="${x0}" y="${nt.y-12}" width="${x1-x0}" height="34" rx="7"/><text x="${(x0+x1)/2}" y="${nt.y+9}" text-anchor="middle">${esc(nt.text)}</text></g>`;
  });

  // messages
  msgs.forEach(m => {
    const marker = m.type === 'ret' ? `sr-${uid}` : m.type === 'async' ? `so-${uid}` : `sf-${uid}`;
    const cls = `msg ${m.type}`;
    const textW = m.m.length*6.7 + (m.c ? m.c.length*6.7 + 8 : 0);
    const label = (lx, anchorStart) => {
      const total = textW + 24;
      const sx = anchorStart ? lx : lx - total/2;
      return `<g class="mlbl"><rect x="${sx-4}" y="${m.y-25}" width="${total+8}" height="19" rx="5"/>
        <g class="num" transform="translate(${sx+8},${m.y-15.5})"><circle r="8"/><text text-anchor="middle" y="3.3">${m.n}</text></g>
        <text class="mt${m.type==='ret'?' r':''}" x="${sx+22}" y="${m.y-11}">${esc(m.m)}${m.c?`<tspan class="mc" dx="8">${esc(m.c)}</tspan>`:''}</text></g>`;
    };
    if (m.self){
      const x = X[m.f] + (m.fd ? 6 : 0);
      s += `<path class="${cls}" d="M${x},${m.y} H${x+40} V${m.y+26} H${x+2}" marker-end="url(#${marker})"/>` + label(x+8, true);
      return;
    }
    const dir = X[m.t] > X[m.f] ? 1 : -1;
    const x1 = X[m.f] + dir*(m.fd ? 6 : 0);
    const x2 = X[m.t] - dir*((m.td || m.activates) ? 6 : 0);
    s += `<path class="${cls}" d="M${x1},${m.y} H${x2}" marker-end="url(#${marker})"/>` + label((x1+x2)/2, false);
  });
  spec._msgs = msgs;
  return s + '</svg>';
}

/* ==========================================================================
   DIAGRAM INTERACTION (pan / zoom / hover-trace / click-through / maximize)
   ========================================================================== */
function attachViewer(svg, signal){
  const base = svg.getAttribute('viewBox').split(/\s+/).map(Number);
  const st = {x:base[0],y:base[1],w:base[2],h:base[3]};
  const apply = () => svg.setAttribute('viewBox', `${st.x} ${st.y} ${st.w} ${st.h}`);
  const toSvg = (cx,cy) => { const p = svg.createSVGPoint(); p.x=cx; p.y=cy; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  const v = {
    zoom(f, cx, cy){
      const nw = clamp(st.w/f, base[2]/6, base[2]*1.6); f = st.w/nw;
      let px = st.x+st.w/2, py = st.y+st.h/2;
      if (cx != null){ const p = toSvg(cx,cy); px = p.x; py = p.y; }
      st.x = px - (px-st.x)/f; st.y = py - (py-st.y)/f; st.w /= f; st.h /= f; apply();
    },
    reset(){ st.x=base[0]; st.y=base[1]; st.w=base[2]; st.h=base[3]; apply(); },
  };
  let drag = null, moved = false;
  svg.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    if (isEditing() && svg.dataset.key){
      const nd = e.target.closest('.node');
      if (nd){ ACTIVE_DRAG = startNodeDrag(svg, nd, e); moved = false; return; }
    }
    const r = svg.getBoundingClientRect();
    drag = {x:e.clientX, y:e.clientY, sx:st.x, sy:st.y, scale:Math.max(st.w/r.width, st.h/r.height)}; moved = false;
  });
  window.addEventListener('pointermove', e => {
    if (ACTIVE_DRAG && ACTIVE_DRAG.svg === svg){ if (moveNodeDrag(ACTIVE_DRAG, e)) moved = true; return; }
    if (!drag) return;
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if (!moved && Math.abs(dx)+Math.abs(dy) > 4){ moved = true; svg.classList.add('panning'); hideTip(); }
    if (moved){ st.x = drag.sx - dx*drag.scale; st.y = drag.sy - dy*drag.scale; apply(); }
  }, {signal});
  window.addEventListener('pointerup', e => {
    if (ACTIVE_DRAG && ACTIVE_DRAG.svg === svg){ endNodeDrag(ACTIVE_DRAG, e, false); return; }
    if (drag){ drag = null; svg.classList.remove('panning'); } }, {signal});
  svg.addEventListener('click', e => {
    if (moved){ e.stopPropagation(); moved = false; return; }
    if (isEditing() && svg.dataset.key){
      const nd = e.target.closest('.node');
      if (nd) openRuleEditor(svg.dataset.key, nd.dataset.id, e);
      return;
    }
    const t = e.target.closest('[data-href]');
    if (t){ if (/\/el-/.test(t.dataset.href)) closeMax(); navigate(t.dataset.href); }   // diagram-to-diagram links stay maximized
  });
  svg.addEventListener('wheel', e => {
    if (!(document.body.classList.contains('maxed') || e.ctrlKey || e.metaKey)) return;
    e.preventDefault(); v.zoom(e.deltaY < 0 ? 1.12 : 1/1.12, e.clientX, e.clientY);
  }, {passive:false});
  // hover tracing
  const uid = svg.dataset.uid;
  svg.addEventListener('mouseover', e => {
    const n = e.target.closest('.node'); if (!n) return;
    const id = n.dataset.id;
    if (svg._dragging) return;
    if (isEditing() && svg.dataset.key){ showTip('Drag to place · click for rules', EL[id].name, e); return; }   // no tracing while editing
    const pill = e.target.closest('.npill');
    svg.classList.add('dim');
    $$('.node', svg).forEach(x => x.classList.toggle('hl', x.dataset.id === id));
    $$('.edge', svg).forEach(ed => {
      const on = ed.dataset.f === id || ed.dataset.t === id;
      ed.classList.toggle('hl', on);
      ed.querySelector('.ln').setAttribute('marker-end', `url(#${on?'arh':'ar'}-${uid})`);
      if (on) $$(`.node[data-id="${ed.dataset.f===id?ed.dataset.t:ed.dataset.f}"]`, svg).forEach(x => x.classList.add('hl'));
    });
    if (svg.classList.contains('seq')) svg.classList.remove('dim');
    if (pill) showTip(pill.dataset.tip, pill.dataset.sub, e);
    else if (n.dataset.tip) showTip(n.dataset.tip, n.dataset.sub, e);
  });
  svg.addEventListener('mousemove', e => { if (svg._dragging) return; if (tipEl.classList.contains('on')) moveTip(e); });
  svg.addEventListener('mouseout', e => {
    if (svg._dragging) return;
    const n = e.target.closest('.node, .boundary');
    if (n && !n.contains(e.relatedTarget)){
      svg.classList.remove('dim'); $$('.hl', svg).forEach(x => x.classList.remove('hl'));
      $$('.edge .ln', svg).forEach(l => l.setAttribute('marker-end', `url(#ar-${uid})`));
      hideTip();
    }
  });
  svg.addEventListener('mouseover', e => { const b = e.target.closest('.boundary.link'); if (b && !e.target.closest('.node')) showTip(b.dataset.tip, '', e); });
  svg._viewer = v;
  return v;
}

const tipEl = $('#tip');
function showTip(t, sub, e){ tipEl.innerHTML = esc(t) + (sub ? `<span>${esc(sub)}</span>` : ''); tipEl.classList.add('on'); moveTip(e); }
function moveTip(e){ const r = tipEl.getBoundingClientRect(); tipEl.style.left = clamp(e.clientX + 14, 8, innerWidth - r.width - 8) + 'px'; tipEl.style.top = (e.clientY + 18) + 'px'; }
function hideTip(){ tipEl.classList.remove('on'); }

function toolsHTML(){
  return `<button class="icon-btn" data-act="zout" title="Zoom out">${ICON.zout}</button>
    <button class="icon-btn" data-act="fit" title="Reset view">${ICON.fit}</button>
    <button class="icon-btn" data-act="zin" title="Zoom in">${ICON.zin}</button>`;
}
function wireTools(root, getSvg){
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const svg = getSvg(), v = svg && svg._viewer; if (!v && b.dataset.act !== 'max') return;
    if (b.dataset.act === 'zin') v.zoom(1.25);
    if (b.dataset.act === 'zout') v.zoom(1/1.25);
    if (b.dataset.act === 'fit') v.reset();
    if (b.dataset.act === 'max') openMax(b.closest('.dcard'));
  });
}

let maxState = null;
function openMax(card){
  const canvas = $('.dcanvas', card), svg = $('svg', canvas);
  maxState = {canvas, svg, card};
  $('#mxTitle').innerHTML = $('.dtitle', card).innerHTML;
  $('#mxLegend').innerHTML = $('.dlegend', card).innerHTML;
  $('#mxCanvas').appendChild(svg);
  svg._viewer.reset();
  $('#mx').hidden = false; document.body.classList.add('maxed'); updateEditbar();
  $('#mxClose').focus();
}
function closeMax(){
  if (!maxState) return;
  maxState.canvas.appendChild(maxState.svg); maxState.svg._viewer.reset();
  $('#mx').hidden = true; document.body.classList.remove('maxed'); maxState = null; hideTip(); updateEditbar();
}
$('#mxTools').innerHTML = toolsHTML();
wireTools($('#mxTools'), () => maxState && maxState.svg);
$('#mxClose').addEventListener('click', closeMax);

function diagramCard(kind, key){
  const isSeq = kind === 'seq';
  const spec = isSeq ? SEQS[key] : layoutDiagram(DIAGRAMS[key]);
  const kinds = isSeq ? [...new Set(spec.p.map(id => EL[id].kind))] : [...new Set([...(spec.boundary?[EL[spec.boundary.id].kind]:[]), ...spec.nodes.map(n => EL[n.id].kind)])];
  const order = Object.keys(KIND); kinds.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  const ext = !isSeq && spec.nodes.some(n => n.ext);
  const level = isSeq ? 'SEQ' : spec.level;
  const title = isSeq ? 'Sequence diagram' : spec.title;
  const sub = isSeq ? spec.title : spec.sub;
  return `<figure class="dcard" data-kind="${kind}" data-key="${key}">
    <div class="dbar">
      <div class="dtitle"><span class="lvl">${level}</span><div><b>${esc(title)}</b><span>${esc(sub)}</span></div></div>
      <div class="dtools">${toolsHTML()}<span class="sep"></span><button class="icon-btn" data-act="max" title="Maximize">${ICON.max}</button></div>
    </div>
    <div class="dcanvas">${isSeq ? seqSVG(spec, key) : c4SVG(spec, key, key)}</div>
    <figcaption class="dlegend">${legendHTML(kinds, {ext, seq:isSeq})}</figcaption>
  </figure>`;
}

/* ==========================================================================
   PAGES — rendered from DATA.pages, one section at a time
   ========================================================================== */
let currentView = 'home';
const elCell = id => { const e = EL[id]; return `<div class="elname k-${e.kind}"><span class="kdot"></span><div><b>${esc(e.name)}</b><small>${esc(e.tag||KIND[e.kind].label)}</small></div></div>`; };
const critBadge = c => c ? `<span class="badge ${/^(high|critical)$/i.test(c)?'b-high':/^med/i.test(c)?'b-med':'b-low'}">${esc(c)}</span>` : '';
const statusBadge = s => `<span class="badge ${/approved|accepted|done|active/i.test(s)?'b-ok':/rejected|deprecated/i.test(s)?'b-high':'b-info'}">${esc(s)}</span>`;
const fmtDate = d => { const t = Date.parse(d); return isNaN(t) ? d : new Date(t).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); };
const chip = (id, key) => { const e = EL[id], lk = linkFor(id, key); return `<a class="chip k-${e.kind}" href="${lk?lk.href:'#'}"><i></i>${esc(e.name)}</a>`; };

/* Catalogue columns: "name" | "description" | "technology" | "kind" | "zoom" | "properties.<key>",
   or {key, label, mono, format:"code"|"badge"}. */
function columnSpec(c){
  const col = typeof c === 'string' ? {key:c} : {...c};
  const k = col.key, prop = k.startsWith('properties.') ? k.slice(11) : null;
  if (!col.label) col.label = {name:'Element', description:'Description', technology:'Technology', kind:'Type', zoom:''}[k] ?? (prop ? prop.replace(/[-_]/g,' ').replace(/^\w/, ch => ch.toUpperCase()) : k);
  if (col.mono == null) col.mono = k === 'technology';
  if (!col.format && prop && /criticality|priority|severity/i.test(prop)) col.format = 'badge';
  col.cell = id => {
    const e = EL[id];
    if (k === 'name') return elCell(id);
    if (k === 'description') return mdInline(e.desc);
    if (k === 'technology') return esc(e.tech);
    if (k === 'kind') return esc(KIND[e.kind].label);
    if (k === 'zoom'){ const lk = linkFor(id, null); return lk && lk.drill ? `<a class="drill" href="${lk.href}">${esc(lk.sub.split(' · ')[0])} diagram ${ICON.arrow}</a>` : ''; }
    const v = prop ? e.props[prop] : e[k];
    if (v == null || v === '') return '';
    if (col.format === 'badge') return critBadge(String(v));
    if (col.format === 'code') return `<code>${esc(v)}</code>`;
    return mdInline(String(v));
  };
  return col;
}

const SECTION = {
  text: s => `<div class="prose">${md(s.body)}</div>`,
  callout: s => `<div class="callout tone-${esc(s.tone || 'info')}">${ICON.info}<div>${md(s.body)}</div></div>`,
  list: s => `<ul class="clean ticks">${(s.items||[]).map(i => `<li>${mdInline(i)}</li>`).join('')}</ul>`,
  stats: s => {
    const n = s.columns || Math.min(4, (s.items||[]).length || 1);
    return `<div class="grid stats-${esc(s.variant || 'default')}" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${(s.items||[]).map(i =>
      `<div class="card stat"><small>${esc(i.label)}</small><b>${mdInline(i.value)}</b>${i.note ? `<span>${mdInline(i.note)}</span>` : ''}</div>`).join('')}</div>`;
  },
  diagram: (s, p) => diagramCard('c4', `${p.id}/${s.id}`),
  sequence: (s, p) => diagramCard('seq', `${p.id}/${s.id}`),
  steps: (s, p) => {
    const key = `${p.id}/${s.of}`, q = SEQS[key];
    if (!q) throw new Error(`"of" must name a sequence section on this page (got "${s.of}")`);
    if (!q._msgs) seqSVG(q, key);
    return `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Flow</th><th>Interaction</th><th>Type</th></tr></thead><tbody>${q._msgs.map(m => `<tr><td><span class="step-n">${m.n}</span></td>
      <td><div class="flow">${chip(m.f, key)}${m.self?'':ICON.arrow+chip(m.t, key)}</div></td>
      <td><span style="color:var(--text);font-weight:500">${esc(m.m)}</span>${m.c?` <code>${esc(m.c)}</code>`:''}${m.info?`<div style="font-size:12.5px;color:var(--muted);margin-top:3px">${mdInline(m.info)}</div>`:''}</td>
      <td><span class="badge ${m.type==='ret'?'b-low':m.type==='async'?'b-med':'b-info'}">${m.self?'internal':m.type==='ret'?'return':m.type}</span></td></tr>`).join('')}</tbody></table></div>`;
  },
  elements: (s, p) => {
    const ids = selectElements(s.select), cols = (s.columns || ['name','description','technology']).map(columnSpec);
    if (!ids.length) return `<div class="rp-empty">No elements match this table's selection.</div>`;
    return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>
      ${ids.map(id => `<tr${CATALOGUE[id] && CATALOGUE[id].page === p.id && CATALOGUE[id].section === s.id ? ` id="el-${id}"` : ''}>${cols.map(c => `<td${c.mono?' class="mono"':''}>${c.cell(id)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  },
  decisions: s => `<div class="card">${(s.items||[]).map(d => `<div class="adr"><span class="id">${esc(d.id || '')}</span><div><b>${mdInline(d.title)}</b>${d.body ? `<p>${mdInline(d.body)}</p>` : ''}</div>${d.status ? statusBadge(d.status) : '<span></span>'}</div>`).join('')}</div>`,
  table: s => `<div class="tbl-wrap"><table>${(s.columns||[]).length ? `<thead><tr>${s.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>` : ''}<tbody>${(s.rows||[]).map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
};

function renderSection(s, p){
  let body;
  try {
    if (!SECTION[s.type]) throw new Error(`unknown section type "${s.type}" (use ${Object.keys(SECTION).join(', ')})`);
    body = SECTION[s.type](s, p);
  } catch(err){
    console.error(`[arc-data] page "${p.id}" › section "${s.id}":`, err);
    body = `<div class="callout tone-warning">${ICON.info}<div><b>This section couldn’t be rendered.</b><br>${esc(err.message)}</div></div>`;
  }
  if (!s.title) return `<div class="sec-cont" id="${esc(s.id)}">${body}</div>`;
  return `<section class="sec" id="${esc(s.id)}" data-sec data-label="${esc(s.title)}"><div class="sec-head">${s.eyebrow ? `<div class="eyebrow">${esc(s.eyebrow)}</div>` : ''}<h2>${esc(s.title)}<a class="anchor" href="#/${p.id}/${esc(s.id)}" aria-label="Link to section">#</a></h2></div>${body}</section>`;
}

function renderPage(p){
  const L = LEVEL[p.level], e = p.element && EL[p.element];
  const meta = e ? [e.tech && `<span class="pill">${esc(e.tech)}</span>`, e.props.owner && `<span class="pill">Owner · ${esc(e.props.owner)}</span>`,

const pagesOf = level => PAGES.filter(p => p.level === level);

        <rect x="222" y="110" width="64" height="36" rx="9" fill="color-mix(in srgb,var(--c-external) 14%,var(--surface))" stroke="var(--c-external)" stroke-width="1.6" stroke-dasharray="4 3"/>

}

/* ==========================================================================
   SIDEBAR — one entry per page, grouped by level (a level with one page is a single link)
   ========================================================================== */
const NAV_ORDER = ['home', ...LEVELS.flatMap(l => pagesOf(l.id).map(p => p.id))];
function buildNav(){
  const c4 = LEVELS.filter(l => l.id !== 'sequence' && pagesOf(l.id).length).map(l => {
    const ps = pagesOf(l.id);
    if (ps.length === 1) return `<a class="nav-solo" href="#/${ps[0].id}" data-page="${ps[0].id}" data-level="${l.id}" title="${esc(ps[0].title)}"><span class="lvl">${l.badge}</span><span class="nav-solo-t">${esc(l.label)}<small>${esc(ps[0].title)}</small></span></a>`;
    return `<div class="nav-group open" data-group="${l.id}">
      <button class="nav-ghead" aria-expanded="true"><span class="lvl">${l.badge}</span>${esc(l.label)}<em class="nav-count">${ps.length}</em>${ICON.chev}</button>
      <div class="nav-gbody"><div><div class="inner">${ps.map(p => `<a class="nav-sec" href="#/${p.id}" data-page="${p.id}">${esc(p.title)}</a>`).join('')}</div></div></div></div>`;
  }).join('');

    ${seqs.length ? `<div class="nav-label">Sequence Diagrams</div>${seqs.map(p => { const q = Object.entries(SEQS).find(([k]) => pageOf(k) === p.id)?.[1];
      return `<a class="nav-seq" href="#/${p.id}" data-page="${p.id}">${ICON.seq}<span>${esc(p.title)}</span>${q ? `<em>${q.p.length}</em>` : ''}</a>`; }).join('')}` : ''}`;
  $$('.nav-ghead').forEach(b => b.addEventListener('click', () => {
    const g = b.parentElement; g.classList.toggle('open'); b.setAttribute('aria-expanded', g.classList.contains('open'));
  }));
}
function setActivePage(v){
  $$('#nav [data-page]').forEach(a => a.classList.toggle('active', a.dataset.page === v));
  const lv = PAGE[v]?.level;
  $$('.nav-group').forEach(g => g.classList.toggle('current', g.dataset.group === lv));
  const g = $(`.nav-group[data-group="${lv}"]`); if (g && !g.classList.contains('open')) g.classList.add('open');
  const a = $(`#nav [data-page="${v}"]`);
  if (a){ const r = a.getBoundingClientRect(), nr = $('#nav').getBoundingClientRect(); if (r.top < nr.top || r.bottom > nr.bottom) a.scrollIntoView({block:'nearest'}); }
}
$('#navFilter').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  $$('#nav [data-page]').forEach(a => {
    const p = PAGE[a.dataset.page];
    const txt = (a.textContent + ' ' + (p ? p.title + ' ' + (p.sections||[]).map(s => s.title || '').join(' ') : '')).toLowerCase();
    a.classList.toggle('nav-hidden', !!q && !txt.includes(q));
  });
  $$('.nav-group').forEach(g => { if (q) g.classList.add('open'); g.classList.toggle('nav-hidden', !!q && !$$('[data-page]:not(.nav-hidden)', g).length); });
});

/* ==========================================================================
   TOP BAR — breadcrumb + the current page's sections as tabs
   ========================================================================== */
function buildTopbar(v){

function setActiveTab(id){
  const t = $(`#tabs [data-tab="${CSS.escape(id || '')}"]`);

  if (t){ const bar = $('#tabs'), r = t.getBoundingClientRect(), br = bar.getBoundingClientRect();

/* ==========================================================================
   ROUTER
   ========================================================================== */
let renderAC = null;
function navigate(href){ if (location.hash === href) route(); else location.hash = href; }
function render(v){
  currentView = v;
  const p = PAGE[v];
  const html = p ? renderPage(p) : renderHome();
  const i = NAV_ORDER.indexOf(v), prev = NAV_ORDER[i-1], next = NAV_ORDER[i+1];
  const pl = k => k === 'home' ? 'Index' : `${LEVEL[PAGE[k].level].badge} · ${PAGE[k].title}`;
  const d = DATA.document || {};
  $('#content').innerHTML = `<div class="view">${html}
    <nav class="pager">${prev?`<a class="prev" href="#/${prev}"><small>← Previous</small><b>${esc(pl(prev))}</b></a>`:''}${next?`<a class="next" href="#/${next}"><small>Next →</small><b>${esc(pl(next))}</b></a>`:''}</nav>

    case 'lowerThan':  return {axis:'Y', first:r.b, second:r.a, key:`Y|${r.b}|${r.a}`};
