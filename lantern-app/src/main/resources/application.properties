spring.application.name=lantern
spring.threads.virtual.enabled=true

# Defaults match the local database in compose.yaml. Override with environment variables.
spring.datasource.url=${LANTERN_DB_URL:jdbc:postgresql://localhost:5432/lantern}
spring.datasource.username=${LANTERN_DB_USERNAME:lantern}
spring.datasource.password=${LANTERN_DB_PASSWORD:lantern}

# The Lantern version, recorded in every snapshot. Filled in by the build.
lantern.version=@project.version@

# Workspace storage (see docs/adr/0016-end-to-end-analysis-run.md): build outputs go to
# <workspace>/builds and rendered documents to <workspace>/documents. A relative path is resolved
# against the working directory.
lantern.workspace=${LANTERN_WORKSPACE:workspace}
# The host directory all sandbox builds share as their Maven cache, created if missing
# (docs/adr/0005-build-sandbox.md). A leading ~ is the home directory of the user running Lantern.
lantern.sandbox.maven-cache-dir=~/workspace/lantern-maven-cache
# The Maven repositories sandbox builds may download from, as a list of id and url (https, exact
# host, no wildcards), in the order Maven tries them. The sandbox's egress proxy lets builds reach
# these hosts and no others (docs/adr/0023-configurable-maven-repositories.md). Maven Central only
# by default; a list set elsewhere, such as a file passed with --spring.config.additional-location,
# replaces it whole.
lantern.sandbox.maven-repositories[0].id=central
lantern.sandbox.maven-repositories[0].url=https://repo.maven.apache.org/maven2
# No Maven mirror by default. Set lantern.sandbox.maven-mirror.id and .url in a file outside the
# repository, passed with --spring.config.additional-location, and every download of a build,
# plugins included, goes through that one URL, the only host builds then reach. It may be http
# and a private-network IPv4 address (docs/adr/0030-maven-mirror.md).

# LLM access (see docs/adr/0009-llm-configuration.md). Models, tiers and prices have no defaults:
# set lantern.llm.models.<name>.*, lantern.llm.tiers.* and optionally lantern.llm.roles.*.
# Without them the app runs and refuses LLM work. Per-model call limits
# (lantern.llm.models.<name>.max-concurrency, .requests-per-minute) and lantern.llm.retry.* have
# defaults; see docs/adr/0021-parallel-llm-calls.md. For a model that thinks by default, set
# lantern.llm.models.<name>.disable-thinking and/or .thinking-headroom-tokens; see
# docs/adr/0022-models-that-think.md.
lantern.llm.anthropic.api-key=${ANTHROPIC_API_KEY:}
# The monthly budget from docs/design.md (Open questions), in US dollars per calendar month (UTC).
lantern.llm.monthly-budget-usd=100
