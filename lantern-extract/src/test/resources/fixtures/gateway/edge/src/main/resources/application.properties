# Spring Cloud Gateway 4.3's key for a servlet gateway; a URI built from a secret is not recorded.
spring.cloud.gateway.server.webmvc.routes[0].id=tokened
spring.cloud.gateway.server.webmvc.routes[0].uri=http://${app.secret-token}.example.com
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/tokened/**
