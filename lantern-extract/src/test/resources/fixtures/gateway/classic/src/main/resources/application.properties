spring.application.name=classic
zuul.prefix=/v2
zuul.strip-prefix=false
zuul.routes.health.path=/health
zuul.routes.health.service-id=health-service
zuul.routes.reports.path=/reports/**
zuul.routes.reports.url=http://reports:8080
zuul.routes.reports.serviceId=ignored-service
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.predicates[0].name=Path
spring.cloud.gateway.discovery.locator.predicates[0].args[pattern]='/svc/'+serviceId+'/**'
