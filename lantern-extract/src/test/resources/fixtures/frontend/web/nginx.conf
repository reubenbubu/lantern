server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Passed on to the gateway, with /api/ kept.
    location /api/ {
        proxy_set_header Host $host;
        proxy_pass http://gateway:8080;
    }

    location /files/ {
        proxy_pass http://storage:9000/media/;
    }

    location ~ \.php$ {
        proxy_pass http://php:9000;
    }
}
