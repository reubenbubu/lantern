apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-service
    spec:
      containers:
        - name: orders
          image: example/orders:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: orders-config
          env:
            - name: ORDERS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-secrets
                  key: password
            - name: JAVA_OPTS
              value: "-Xmx512m"
            - name: PORT
              value: "8080"
            - name: SPRING_APPLICATION_JSON
              value: '{"server":{"port":9000},"orders":{"region":"eu"}}'
            - name: JAVA_TOOL_OPTIONS
              value: "-Dspring.profiles.active=jvm -Dorders.mode=fast"
          args: ["--spring.profiles.active=k8s", "--server.port=$(PORT)"]
---
apiVersion: v1
kind: Service
metadata:
  name: orders-svc
spec:
  selector:
    app.kubernetes.io/name: orders-service
  ports:
    - port: 80
      targetPort: 8080
