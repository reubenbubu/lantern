apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
configMapGenerator:
  - name: orders-config
    envs:
      - orders.properties
    literals:
      - LOG_LEVEL=info
patches:
  - path: replicas.yaml
  - target:
      kind: StatefulSet
      labelSelector: tier=data
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
images:
  - name: example/orders
    newTag: 1.4.0
